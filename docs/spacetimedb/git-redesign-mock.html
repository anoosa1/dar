<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dar Git — Redesign Mockup</title>
<style>
*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  font-family: var(--font-sans, 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif);
  font-size: 13px;
  line-height: 1.45;
  background: transparent;
  color: var(--foreground, #faeaf3);
  -webkit-font-smoothing: antialiased;
}

.mock-shell {
  display: flex;
  flex-direction: column;
  gap: 10px;
  width: 100%;
  padding: 0;
}

/* Mockup presenter control bar */
.mock-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 6px 10px;
}
.mock-group {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
}
.mock-btn {
  appearance: none;
  border: 1px solid var(--border, rgba(186,150,178,.28));
  background: var(--secondary, rgba(115,57,111,.10));
  color: var(--muted-foreground, #b89eb4);
  font: 550 11.5px/1 inherit;
  padding: 6px 9px;
  border-radius: 8px;
  cursor: pointer;
  white-space: nowrap;
  transition: background .12s, color .12s, border-color .12s;
}
.mock-btn:hover { color: var(--foreground, #faeaf3); background: rgba(115,57,111,.2); }
.mock-btn.active {
  background: #73396f;
  color: #fff7fc;
  border-color: transparent;
  font-weight: 600;
}

/* Dar Twilight Stage (Nightfall default, Afterglow light) */
.stage {
  --bg: #26111f;
  --panel: #301c2b;
  --raised: #3a2536;
  --code-bg: #21101c;
  --popover: rgba(54, 33, 50, 0.96);
  --hover: #412b3f;
  --border: rgba(186, 150, 178, 0.22);
  --border-strong: rgba(186, 150, 178, 0.36);
  --row-div: rgba(186, 150, 178, 0.13);
  --text: #faeaf3;
  --muted: #cfb4ca;
  --dim: #9c7e97;
  --accent: #f2a2a9;
  --on-accent: #26111f;
  --tonal: #4d3c73;
  --on-tonal: #f3eafd;
  --rose: #d889af;
  --success: #b2dec4;
  --success-soft: #284136;
  --warning: #ffc493;
  --warning-soft: #4b3429;
  --danger: #ffb2c6;
  --error-soft: #4e2436;
  --sky: #9cc4f8;
  --sky-soft: rgba(156, 196, 248, 0.16);
  --lavender: #cab4f7;
  --lavender-soft: rgba(202, 180, 247, 0.17);
  --shadow: 0 14px 36px rgba(10, 3, 10, 0.50), 0 2px 8px rgba(10, 3, 10, 0.30);
  --mono: var(--font-mono, 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace);
  --sans: var(--font-sans, 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif);

  /* 5 distinct commit graph lane hues */
  --lane-0: #f2a2a9;
  --lane-1: #9cc4f8;
  --lane-2: #a5dfc0;
  --lane-3: #ffc493;
  --lane-4: #cab4f7;

  position: relative;
  width: 100%;
  height: 700px;
  border-radius: 16px;
  overflow: hidden;
  border: 1px solid var(--border-strong);
  background: var(--bg);
  color: var(--text);
  display: grid;
  grid-template-rows: 52px minmax(0, 1fr);
  box-shadow: var(--shadow);
  color-scheme: dark;
}
.stage[data-theme="light"] {
  color-scheme: light;
  --bg: #fbf4f6;
  --panel: #fffafb;
  --raised: #ffffff;
  --code-bg: #f8f1f4;
  --popover: rgba(255, 252, 253, 0.96);
  --hover: #f3e7ee;
  --border: rgba(115, 57, 111, 0.17);
  --border-strong: rgba(115, 57, 111, 0.30);
  --row-div: rgba(115, 57, 111, 0.10);
  --text: #352138;
  --muted: #6e546d;
  --dim: #8b708a;
  --accent: #73396f;
  --on-accent: #fff7fc;
  --tonal: #ede3f5;
  --on-tonal: #4d3c73;
  --rose: #a94a76;
  --success: #246144;
  --success-soft: #e3f0e9;
  --warning: #8a4f16;
  --warning-soft: #fbe9d8;
  --danger: #a32745;
  --error-soft: #fbe9ee;
  --sky: #2b5899;
  --sky-soft: #e5effc;
  --lavender: #5b4199;
  --lavender-soft: #ede6fa;
  --shadow: 0 14px 36px rgba(38, 17, 31, 0.14), 0 2px 8px rgba(38, 17, 31, 0.08);
  --lane-0: #73396f;
  --lane-1: #2b5899;
  --lane-2: #246144;
  --lane-3: #8a4f16;
  --lane-4: #5b4199;
}

svg.ic {
  width: 15px; height: 15px; flex: none;
  fill: none; stroke: currentColor; stroke-width: 1.75;
  stroke-linecap: round; stroke-linejoin: round;
}
.mono { font-family: var(--mono); }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.dim { color: var(--dim); }

/* Shared Full-Canvas Topbar */
.topbar {
  display: flex; align-items: center; gap: 8px;
  padding: 0 12px; min-width: 0;
}
.tb-start { display: flex; align-items: center; gap: 6px; flex: none; min-width: 0; }
.dar-mark {
  display: grid; place-items: center;
  width: 28px; height: 28px; border-radius: 8px;
  background: var(--accent); color: var(--on-accent);
  font-size: 13.5px; font-weight: 760; flex: none;
}
.tb-title { font-size: 15.5px; font-weight: 640; letter-spacing: -.015em; }
.tb-crumb {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 12.5px; color: var(--muted); padding-left: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tb-search {
  flex: 0 1 420px; margin: 0 auto; min-width: 0;
  height: 36px; padding: 0 8px 0 12px;
  border-radius: 18px; border: 1px solid var(--border);
  background: var(--panel); color: var(--muted);
  display: flex; align-items: center; gap: 8px; font-size: 12.5px;
}
.tb-search span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tb-search kbd {
  margin-left: auto; font: 550 10px/16px var(--mono);
  padding: 1px 5px; border-radius: 5px; border: 1px solid var(--border);
  color: var(--muted); flex: none;
}
.tb-end { display: flex; align-items: center; gap: 4px; flex: none; }
.tb-menu-btn { display: none; }

.ib {
  display: inline-grid; place-items: center;
  width: 30px; height: 30px; border: 0; border-radius: 9px;
  background: transparent; color: var(--muted); cursor: pointer; flex: none;
  transition: background .1s, color .1s;
}
.ib:hover { background: var(--hover); color: var(--text); }
.ib.on { background: var(--tonal); color: var(--on-tonal); }
.avatar {
  width: 28px; height: 28px; border-radius: 50%; flex: none;
  display: inline-grid; place-items: center;
  background: var(--tonal); color: var(--on-tonal);
  font-size: 11px; font-weight: 680;
}
.avatar.sm { width: 22px; height: 22px; font-size: 9px; }
.avatar.agent { background: var(--lavender-soft); color: var(--lavender); }

/* Workspace Grid */
.workspace {
  display: grid;
  grid-template-columns: 224px minmax(0, 1fr);
  gap: 8px;
  padding: 0 8px 8px;
  min-height: 0;
  overflow: hidden;
  position: relative;
}
.stage[data-sidebar-folded="true"] .workspace {
  grid-template-columns: minmax(0, 1fr);
}
.stage[data-sidebar-folded="true"] .sidebar {
  display: none;
}
.stage[data-sidebar-folded="true"] .tb-menu-btn {
  display: inline-grid;
}
.stage[data-sidebar-folded="true"].drawer-open .sidebar {
  position: absolute; top: 0; bottom: 0; left: 0; z-index: 60;
  width: 248px; padding: 12px 10px;
  background: var(--panel); border-right: 1px solid var(--border-strong);
  box-shadow: 12px 0 36px rgba(0,0,0,.45);
  display: flex;
}

/* Sidebar */
.sidebar {
  display: flex; flex-direction: column; min-height: 0;
  padding: 2px 2px 2px 4px; overflow: hidden;
}
.create-btn {
  display: inline-flex; align-items: center; gap: 8px;
  align-self: flex-start; height: 42px; padding: 0 16px 0 13px;
  margin: 0 0 10px 2px; border: 0; border-radius: 14px;
  background: var(--tonal); color: var(--on-tonal);
  font: 600 13px/1 inherit; cursor: pointer;
  box-shadow: 0 1px 3px rgba(0,0,0,.18);
}
.create-btn:hover { filter: brightness(1.07); }
.side-scroll { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: thin; padding-right: 2px; }
.nav-list { display: flex; flex-direction: column; gap: 1px; }
.nav-item {
  display: flex; align-items: center; gap: 8px;
  width: 100%; height: 33px; padding: 0 10px;
  border: 0; border-radius: 17px;
  background: transparent; color: var(--text);
  font: 500 12.6px/1 inherit; text-align: left; cursor: pointer;
}
.nav-item:hover { background: var(--hover); }
.nav-item.active { background: var(--tonal); color: var(--on-tonal); font-weight: 600; }
.nav-item svg.ic { color: var(--muted); }
.nav-item.active svg.ic { color: var(--on-tonal); }
.nav-lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-cnt {
  margin-left: auto; font-size: 11px; font-weight: 600;
  color: var(--muted); font-variant-numeric: tabular-nums;
  padding: 1px 6px; border-radius: 999px;
}
.nav-item.active .nav-cnt { background: color-mix(in srgb, var(--on-tonal) 13%, transparent); color: var(--on-tonal); }
.side-head {
  display: flex; align-items: center; justify-content: space-between;
  margin: 12px 4px 4px 10px;
  font-size: 11.5px; font-weight: 620; color: var(--muted);
}
.dirty-dot {
  width: 7px; height: 7px; border-radius: 50%; background: var(--warning); flex: none;
}

.repo-mark {
  display: inline-grid; place-items: center; flex: none;
  width: 18px; height: 18px; border-radius: 5px;
  font-size: 10px; font-weight: 750; color: #fff;
}
.repo-mark.m { width: 28px; height: 28px; border-radius: 8px; font-size: 13px; }
.repo-mark.h0 { background: #73396f; }
.repo-mark.h1 { background: #2b5899; }
.repo-mark.h2 { background: #8a5a12; }
.repo-mark.h3 { background: #5b4199; }
.repo-mark.h4 { background: #246144; }

.side-foot {
  flex: none; margin-top: 8px; padding-top: 6px; border-top: 1px solid var(--row-div);
}
.cred-row {
  display: flex; align-items: center; gap: 8px;
  width: 100%; padding: 6px 10px; border: 0; border-radius: 10px;
  background: transparent; color: var(--muted);
  font: 500 12px/1.2 inherit; cursor: pointer; text-align: left;
}
.cred-row:hover { background: var(--hover); color: var(--text); }
.cred-row strong { color: var(--text); font-weight: 600; }
.cred-row .cred-tag {
  margin-left: auto; font-size: 11px; color: var(--accent); font-weight: 600;
}

/* Sheets inside workspace */
.main-area {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 8px;
  min-width: 0;
  min-height: 0;
}
.main-area.with-drawer {
  grid-template-columns: minmax(0, 1fr) 348px;
}
.sheet {
  display: flex; flex-direction: column; min-width: 0; min-height: 0;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 16px; overflow: hidden;
}
.sheet-scroll {
  flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: thin;
  padding: 14px 18px 22px;
}

/* Shared Buttons, Segmented, Pills */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  height: 30px; padding: 0 11px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--panel); color: var(--text);
  font: 560 12px/1 inherit; cursor: pointer; white-space: nowrap;
}
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; font-weight: 620; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.tonal { background: var(--tonal); color: var(--on-tonal); border-color: transparent; }
.btn.sm { height: 26px; padding: 0 9px; font-size: 11.5px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { background: var(--hover); color: var(--text); }
.btn.danger { background: var(--danger); color: var(--on-accent); border-color: transparent; }

.seg {
  display: inline-flex; align-items: center; gap: 2px;
  padding: 2px; border-radius: 10px; background: var(--hover); flex: none;
}
.seg button {
  border: 0; background: transparent; color: var(--muted);
  height: 26px; padding: 0 9px; border-radius: 8px;
  display: inline-flex; align-items: center; gap: 5px;
  font: 560 11.8px/1 inherit; cursor: pointer; white-space: nowrap;
}
.seg button:hover { color: var(--text); }
.seg button.active {
  background: var(--panel); color: var(--text);
  box-shadow: 0 1px 2px rgba(0,0,0,.22);
}

.fchip {
  display: inline-flex; align-items: center; gap: 5px;
  height: 26px; padding: 0 10px; border-radius: 999px;
  border: 1px solid var(--border); background: transparent;
  color: var(--muted); font: 550 11.8px/1 inherit; cursor: pointer; white-space: nowrap;
}
.fchip:hover { background: var(--hover); color: var(--text); }
.fchip.active { background: var(--tonal); color: var(--on-tonal); border-color: transparent; font-weight: 600; }

.sha-pill {
  font: 550 11px/1 var(--mono);
  padding: 3px 7px; border-radius: 6px;
  background: var(--hover); color: var(--text);
  border: 0; cursor: pointer; white-space: nowrap;
}
.sha-pill:hover { background: var(--tonal); color: var(--on-tonal); }

.ref-pill {
  display: inline-flex; align-items: center; gap: 4px;
  height: 20px; padding: 0 7px; border-radius: 999px;
  font: 600 10.5px/1 var(--mono);
  border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
  color: var(--accent); white-space: nowrap;
}
.ref-pill.tag {
  color: var(--warning);
  border-color: color-mix(in srgb, var(--warning) 45%, transparent);
}
.src-pill {
  display: inline-flex; align-items: center; gap: 4px;
  height: 19px; padding: 0 7px; border-radius: 999px;
  font-size: 10.5px; font-weight: 600;
  background: var(--hover); color: var(--muted); white-space: nowrap;
}
.src-pill.agent { background: var(--lavender-soft); color: var(--lavender); }
.src-pill.dar { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
.src-pill.git { background: var(--sky-soft); color: var(--sky); }

.stat-added { color: var(--success); font: 600 11.5px/1 var(--mono); }
.stat-removed { color: var(--danger); font: 600 11.5px/1 var(--mono); }

/* Overview */
.ov-head {
  display: flex; align-items: center; justify-content: space-between;
  min-height: 48px; padding: 8px 18px; border-bottom: 1px solid var(--row-div); flex: none;
}
.ov-head h1 { margin: 0; font-size: 18px; font-weight: 650; letter-spacing: -.015em; }
.ov-stack { display: flex; flex-direction: column; gap: 16px; }

.heat-card {
  border: 1px solid var(--border); border-radius: 14px;
  padding: 13px 15px; background: var(--raised);
  position: relative;
}
.heat-top {
  display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px;
  margin-bottom: 10px;
}
.heat-top strong { font-size: 13px; font-weight: 630; }
.heat-src-mix {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  font-size: 11px; color: var(--muted);
}
.mix-bar {
  display: inline-flex; width: 68px; height: 5px; border-radius: 3px; overflow: hidden; gap: 1px;
}
.mix-git { width: 67%; background: var(--sky); }
.mix-dar { width: 18%; background: var(--accent); }
.mix-agent { width: 15%; background: var(--lavender); }
.heat-legend {
  margin-left: auto; display: flex; align-items: center; gap: 3px;
  font-size: 10.5px; color: var(--muted);
}
.heat-legend i, .heat-grid i {
  display: block; width: 10px; height: 10px; border-radius: 2.5px;
}
.l0 { background: var(--hover); }
.l1 { background: color-mix(in srgb, var(--accent) 28%, var(--hover)); }
.l2 { background: color-mix(in srgb, var(--accent) 52%, var(--hover)); }
.l3 { background: color-mix(in srgb, var(--accent) 76%, var(--hover)); }
.l4 { background: var(--accent); }

.heat-scroll { overflow-x: auto; scrollbar-width: thin; padding-bottom: 2px; }
.heat-months {
  display: grid; grid-auto-flow: column; grid-auto-columns: 10px; gap: 3px;
  margin: 0 0 4px 30px; font-size: 10px; color: var(--dim); white-space: nowrap;
}
.heat-body { display: flex; gap: 5px; }
.heat-days {
  display: grid; grid-template-rows: repeat(7, 10px); gap: 3px;
  width: 25px; flex: none; font-size: 9.5px; line-height: 10px; color: var(--dim);
}
.heat-grid {
  display: grid; grid-auto-flow: column;
  grid-template-rows: repeat(7, 10px); grid-auto-columns: 10px; gap: 3px;
}
.heat-grid i.future { background: transparent; }
.heat-tip {
  min-height: 16px; margin-top: 6px; font-size: 11px; color: var(--muted);
  display: flex; align-items: center; justify-content: space-between;
}

/* Actionable Needs Attention strip */
.attention-strip {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;
}
.att-item {
  display: flex; align-items: center; gap: 9px;
  padding: 9px 11px; border-radius: 12px;
  border: 1px solid var(--border); background: var(--panel);
  cursor: pointer; text-align: left; color: var(--text); font: inherit;
  transition: border-color .12s, background .12s;
}
.att-item:hover { background: var(--hover); border-color: var(--border-strong); }
.att-icon {
  width: 28px; height: 28px; border-radius: 8px; flex: none;
  display: grid; place-items: center;
}
.att-icon.warn { background: var(--warning-soft); color: var(--warning); }
.att-icon.pr { background: var(--success-soft); color: var(--success); }
.att-icon.agent { background: var(--lavender-soft); color: var(--lavender); }
.att-text { flex: 1; min-width: 0; }
.att-text strong { display: block; font-size: 12px; font-weight: 620; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.att-text small { display: block; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.ov-grid {
  display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(240px, .9fr);
  gap: 16px; align-items: start;
}
.sec-bar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px; margin-bottom: 8px; flex-wrap: wrap;
}
.sec-bar h2 { margin: 0; font-size: 12.5px; font-weight: 630; color: var(--muted); }
.repo-cards {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(225px, 1fr)); gap: 8px;
}
.repo-card {
  display: flex; flex-direction: column; gap: 7px;
  padding: 12px 13px; border-radius: 13px;
  border: 1px solid var(--border); background: var(--raised);
  color: var(--text); font: inherit; text-align: left; cursor: pointer;
  transition: border-color .12s, background .12s;
}
.repo-card:hover { background: var(--hover); border-color: var(--border-strong); }
.rc-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
.rc-head strong { font-size: 13.5px; font-weight: 630; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rc-head small { margin-left: auto; font-size: 11px; color: var(--dim); white-space: nowrap; }
.rc-desc {
  font-size: 12px; color: var(--muted); line-height: 1.4;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  min-height: 33px;
}
.rc-desc.empty { font-style: italic; color: var(--dim); }
.rc-foot {
  display: flex; align-items: center; gap: 10px;
  font-size: 11px; color: var(--muted); padding-top: 2px;
}
.rc-foot > span { display: inline-flex; align-items: center; gap: 3.5px; }
.rc-foot svg.ic { width: 12px; height: 12px; }
.rc-tracker {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 6px; border-radius: 999px;
  background: var(--success-soft); color: var(--success); font-weight: 600;
}
.spark {
  margin-left: auto; display: inline-flex; align-items: flex-end; gap: 2px; height: 18px;
}
.spark i { display: block; width: 3px; border-radius: 1.5px; background: var(--accent); opacity: .82; }
.spark i.h0 { height: 2px; opacity: .24; }
.spark i.h1 { height: 4px; } .spark i.h2 { height: 6px; }
.spark i.h3 { height: 9px; } .spark i.h4 { height: 12px; }
.spark i.h5 { height: 15px; } .spark i.h6 { height: 18px; }

.feed-box {
  border: 1px solid var(--border); border-radius: 13px;
  background: var(--raised); overflow: hidden;
}
.feed-row {
  display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 9px;
  padding: 9px 12px; border-top: 1px solid var(--row-div);
  cursor: pointer; text-align: left; width: 100%; border-left: 0; border-right: 0; border-bottom: 0;
  background: transparent; color: inherit; font: inherit;
}
.feed-row:first-child { border-top: 0; }
.feed-row:hover { background: var(--hover); }
.feed-body { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.feed-top { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; font-size: 12px; }
.feed-msg { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.feed-meta { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--dim); }

/* Repository Header + Tabs */
.repo-head {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 10px 14px 6px 18px; flex: none; position: relative;
}
.repo-title { min-width: 120px; flex: 1; }
.repo-title-line { display: flex; align-items: center; gap: 8px; }
.repo-title h1 {
  margin: 0; font-size: 16.5px; font-weight: 650; letter-spacing: -.015em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.repo-crumb {
  display: flex; align-items: center; gap: 5px;
  font-size: 11.5px; color: var(--muted); min-width: 0;
}
.repo-crumb span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.repo-tools { display: flex; align-items: center; gap: 5px; flex: none; }

.tabs-bar {
  display: flex; align-items: center; gap: 2px;
  padding: 0 14px; border-bottom: 1px solid var(--border);
  overflow-x: auto; scrollbar-width: none; flex: none;
}
.tabs-bar::-webkit-scrollbar { display: none; }
.tab-btn {
  display: inline-flex; align-items: center; gap: 6px;
  height: 40px; padding: 0 11px; border: 0;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
  background: transparent; color: var(--muted);
  font: 560 12.6px/1 inherit; cursor: pointer; white-space: nowrap;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 620; }
.tab-cnt {
  font-size: 10.5px; font-weight: 600; padding: 1px 6px; border-radius: 999px;
  background: var(--hover); color: var(--muted); font-variant-numeric: tabular-nums;
}

/* Clone Popover */
.clone-pop {
  display: none; position: absolute; right: 14px; top: 52px; z-index: 40;
  width: min(390px, calc(100% - 28px)); padding: 13px;
  border-radius: 14px; border: 1px solid var(--border-strong);
  background: var(--popover); backdrop-filter: blur(18px);
  box-shadow: var(--shadow); flex-direction: column; gap: 9px;
}
.clone-pop.open { display: flex; }
.clone-pop-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.clone-pop-head strong { font-size: 12.5px; }
.clone-box {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 8px 6px 10px; border-radius: 9px;
  border: 1px solid var(--border); background: var(--code-bg);
  font: 11.5px/1.4 var(--mono); color: var(--text);
}
.clone-box span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.clone-actions {
  display: flex; flex-direction: column; gap: 2px;
  padding-top: 6px; border-top: 1px solid var(--row-div);
}
.clone-row-btn {
  display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px;
  border: 0; border-radius: 8px; background: transparent; color: var(--text);
  font: inherit; font-size: 12.5px; cursor: pointer; text-align: left;
}
.clone-row-btn:hover { background: var(--hover); }
.clone-row-btn small { margin-left: auto; color: var(--muted); font-size: 11px; }

/* Toolbar inside tabs */
.panel-toolbar {
  display: flex; align-items: center; flex-wrap: wrap; gap: 7px;
  margin-bottom: 11px;
}
.toolbar-end { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.inline-input {
  display: flex; align-items: center; gap: 6px;
  height: 30px; padding: 0 9px; border-radius: 9px;
  border: 1px solid var(--border); background: var(--bg); color: var(--text);
  min-width: 140px;
}
.inline-input input {
  border: 0; background: transparent; color: var(--text); font: inherit; font-size: 12px;
  outline: none; width: 100%; min-width: 0;
}
.inline-input kbd {
  font: 600 10px/1 var(--mono); padding: 2px 4px; border-radius: 4px;
  border: 1px solid var(--border); color: var(--dim);
}

/* Code Tab */
.code-grid {
  display: grid; grid-template-columns: minmax(0, 1fr) 232px; gap: 14px; align-items: start;
}
.code-main { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.dirty-banner {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px; border-radius: 11px;
  background: var(--warning-soft); color: var(--warning); font-size: 12px;
}
.dirty-banner div { flex: 1; min-width: 0; }
.dirty-banner strong { display: block; font-weight: 640; }

.tree-card {
  border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--panel);
}
.latest-bar {
  display: flex; align-items: center; gap: 8px; min-height: 40px;
  padding: 6px 12px; background: var(--raised); border-bottom: 1px solid var(--row-div);
  font-size: 12px; flex-wrap: wrap;
}
.latest-msg { flex: 1; min-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
.file-table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 12.5px; }
.file-table tr { border-top: 1px solid var(--row-div); cursor: pointer; }
.file-table tr:first-child { border-top: 0; }
.file-table tr:hover { background: var(--hover); }
.file-table td { height: 36px; padding: 0 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.file-table td:first-child { width: 34%; font-weight: 550; }
.file-table td:nth-child(2) { color: var(--muted); }
.file-table td:last-child { width: 88px; text-align: right; color: var(--dim); font-size: 11.5px; }
.file-name-cell { display: inline-flex; align-items: center; gap: 8px; max-width: 100%; }
.ic-folder { color: var(--accent); }
.ic-code { color: var(--sky); }
.ic-doc { color: var(--lavender); }

/* Single-bordered README card (fixes double-border bug!) */
.readme-card {
  border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--panel);
}
.readme-head {
  display: flex; align-items: center; gap: 7px; height: 38px; padding: 0 13px;
  border-bottom: 1px solid var(--row-div); background: var(--raised);
  font-size: 12px; font-weight: 620;
}
.readme-body {
  padding: 15px 18px; font-size: 13px; line-height: 1.62;
}
.readme-body h2 { margin: 0 0 8px; font-size: 18px; font-weight: 650; }
.readme-body h3 { margin: 16px 0 6px; font-size: 14px; font-weight: 630; }
.readme-body p { margin: 0 0 10px; color: var(--muted); }
.readme-body ul { margin: 0 0 10px; padding-left: 18px; color: var(--muted); }
.readme-body code {
  font: 11.5px/1 var(--mono); padding: 1px 5px; border-radius: 5px;
  background: var(--code-bg); color: var(--text);
}
.readme-body pre {
  margin: 8px 0 0; padding: 10px 12px; border-radius: 9px;
  border: 1px solid var(--row-div); background: var(--code-bg);
  font: 11.5px/1.55 var(--mono); overflow-x: auto;
}

.about-rail {
  display: flex; flex-direction: column; gap: 12px;
  padding: 13px; border-radius: 12px;
  border: 1px solid var(--border); background: var(--raised);
  font-size: 12px;
}
.about-rail h3 { margin: 0; font-size: 12px; font-weight: 640; color: var(--muted); }
.about-rail p { margin: 0; color: var(--text); line-height: 1.5; }
.about-facts { display: flex; flex-direction: column; gap: 7px; padding-top: 8px; border-top: 1px solid var(--row-div); }
.about-fact { display: flex; align-items: center; gap: 7px; color: var(--muted); }
.about-fact strong { margin-left: auto; color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.clone-mini {
  display: flex; align-items: center; gap: 6px; padding: 6px 8px;
  border-radius: 8px; background: var(--code-bg); border: 1px solid var(--row-div);
  font: 11px/1 var(--mono); color: var(--muted); cursor: pointer;
}
.clone-mini span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.clone-mini:hover { border-color: var(--accent); color: var(--text); }

/* View 3: Inline Full-Width File Reader */
.reader-layout {
  flex: 1; min-height: 0;
  display: grid; grid-template-columns: 188px minmax(0, 1fr);
}
.reader-layout.tree-hidden { grid-template-columns: minmax(0, 1fr); }
.reader-layout.tree-hidden .file-tree-pane { display: none; }
.file-tree-pane {
  border-right: 1px solid var(--border); background: var(--bg);
  display: flex; flex-direction: column; min-height: 0; padding: 8px 6px;
  overflow-y: auto; scrollbar-width: thin;
}
.tree-hdr {
  display: flex; align-items: center; justify-content: space-between;
  padding: 2px 8px 6px; font-size: 11px; font-weight: 640; color: var(--muted);
}
.tree-item {
  display: flex; align-items: center; gap: 6px;
  width: 100%; height: 28px; padding: 0 8px; border: 0; border-radius: 7px;
  background: transparent; color: var(--muted);
  font: 500 12px/1 inherit; text-align: left; cursor: pointer;
}
.tree-item:hover { background: var(--hover); color: var(--text); }
.tree-item.active { background: var(--tonal); color: var(--on-tonal); font-weight: 600; }
.tree-item.ind1 { padding-left: 18px; }
.tree-item.ind2 { padding-left: 28px; }
.tree-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.code-stage {
  display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--code-bg);
}
.code-bar {
  display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
  min-height: 42px; padding: 6px 12px;
  border-bottom: 1px solid var(--border); background: var(--panel);
}
.code-path {
  display: flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 600;
  min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.code-meta-pill {
  font-size: 11px; color: var(--muted); padding: 2px 7px; border-radius: 999px;
  background: var(--hover); font-variant-numeric: tabular-nums;
}
.code-well {
  flex: 1; min-height: 0; overflow: auto; scrollbar-width: thin;
  padding: 10px 0; font: 12px/20px var(--mono);
}
.code-line {
  display: grid; grid-template-columns: 46px minmax(0, 1fr);
  min-width: max-content; padding-right: 16px;
}
.code-well.wrap .code-line { min-width: 0; }
.code-well.wrap .code-txt { white-space: pre-wrap; overflow-wrap: anywhere; }
.code-line:hover { background: rgba(255,255,255,.03); }
.code-line.anchor {
  background: color-mix(in srgb, var(--accent) 14%, transparent);
  box-shadow: inset 3px 0 0 var(--accent);
}
.code-ln {
  user-select: none; text-align: right; padding-right: 12px;
  color: var(--dim); cursor: pointer; font-size: 11px;
}
.code-ln:hover { color: var(--accent); }
.code-txt { white-space: pre; color: var(--text); }
.syn-kw { color: var(--rose); font-weight: 600; }
.syn-ty { color: var(--lavender); }
.syn-str { color: var(--success); }
.syn-fn { color: var(--sky); }
.syn-num { color: var(--warning); }
.syn-cmt { color: var(--dim); font-style: italic; }

/* View 4: PR Review Full-Stage */
.pr-top {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; flex-wrap: wrap;
  padding: 10px 16px; border-bottom: 1px solid var(--row-div); flex: none;
}
.pr-top-main { flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.pr-title-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pr-title-row h2 { margin: 0; font-size: 15.5px; font-weight: 640; letter-spacing: -.01em; }
.pr-sub-row { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); }
.state-pill {
  display: inline-flex; align-items: center; gap: 5px;
  height: 22px; padding: 0 9px; border-radius: 999px;
  font-size: 11.5px; font-weight: 630;
}
.state-pill.open { background: var(--success-soft); color: var(--success); }
.state-pill.merged { background: var(--tonal); color: var(--on-tonal); }
.branch-pair {
  display: inline-flex; align-items: center; gap: 4px;
  font: 600 11px/1 var(--mono);
}
.branch-pair code {
  padding: 3px 6px; border-radius: 6px; background: var(--hover); color: var(--text);
}
.lbl-chip {
  display: inline-flex; align-items: center; gap: 5px;
  height: 20px; padding: 0 8px; border-radius: 999px;
  font-size: 11px; font-weight: 600;
  border: 1px solid var(--border); background: var(--panel); color: var(--text);
}
.lbl-chip i { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.lbl-ux i { background: var(--lavender); }
.lbl-enh i { background: var(--sky); }
.lbl-bug i { background: var(--danger); }
.lbl-perf i { background: var(--warning); }

.pr-subbar {
  display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
  padding: 7px 16px; border-bottom: 1px solid var(--border); background: var(--raised); flex: none;
}
.pr-files-layout {
  flex: 1; min-height: 0; display: grid; grid-template-columns: 184px minmax(0, 1fr);
}
.pr-files-layout.rail-hidden { grid-template-columns: minmax(0, 1fr); }
.pr-files-layout.rail-hidden .pr-files-rail { display: none; }
.pr-files-rail {
  border-right: 1px solid var(--border); background: var(--bg);
  padding: 10px 7px; overflow-y: auto; scrollbar-width: thin;
  display: flex; flex-direction: column; gap: 4px;
}
.changed-item {
  display: flex; align-items: center; gap: 7px;
  padding: 6px 8px; border-radius: 8px; cursor: pointer;
  font-size: 11.8px; color: var(--muted);
}
.changed-item:hover { background: var(--hover); color: var(--text); }
.changed-item.active { background: var(--tonal); color: var(--on-tonal); font-weight: 600; }
.changed-item .fname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: 11px; }
.viewed-chk { accent-color: var(--accent); cursor: pointer; flex: none; }

.diff-stage {
  flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: thin;
  padding: 12px 14px 20px; display: flex; flex-direction: column; gap: 12px;
}
.diff-card {
  flex: none; border: 1px solid var(--border); border-radius: 11px; overflow: hidden; background: var(--code-bg);
}
.diff-card-head {
  display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 11px;
  background: var(--raised); border-bottom: 1px solid var(--border);
  font-size: 12px; cursor: pointer;
}
.diff-card-head .path { font: 600 11.8px/1 var(--mono); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kind-pill {
  font-size: 10px; font-weight: 650; padding: 2px 7px; border-radius: 999px;
}
.kind-pill.add { background: var(--success-soft); color: var(--success); }
.kind-pill.mod { background: var(--warning-soft); color: var(--warning); }
.viewed-pill {
  display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--muted);
  padding: 2px 7px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel);
  cursor: pointer;
}
.viewed-pill.on { background: var(--success-soft); color: var(--success); border-color: transparent; font-weight: 600; }

.diff-rows { font: 11.5px/19px var(--mono); overflow-x: auto; }
.dline { display: flex; min-width: max-content; }
.dline.hunk { background: color-mix(in srgb, var(--accent) 8%, var(--panel)); color: var(--muted); font-size: 11px; }
.dline.add { background: color-mix(in srgb, var(--success) 13%, transparent); }
.dline.del { background: color-mix(in srgb, var(--danger) 14%, transparent); }
.dnum { width: 34px; flex: none; text-align: right; padding: 0 5px; color: var(--dim); font-size: 10.5px; user-select: none; }
.dsign { width: 16px; flex: none; text-align: center; user-select: none; font-weight: 700; }
.dline.add .dsign { color: var(--success); }
.dline.del .dsign { color: var(--danger); }
.dtxt { padding: 0 10px 0 2px; white-space: pre; }
.diff-rows.wrap .dline { min-width: 0; }
.diff-rows.wrap .dtxt { white-space: pre-wrap; overflow-wrap: anywhere; }

/* Split Side-by-Side Diff */
.split-grid {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  font: 11.3px/19px var(--mono); overflow-x: auto;
}
.split-cell {
  display: flex; min-width: 0; border-right: 1px solid var(--row-div);
}
.split-cell:nth-child(2n) { border-right: 0; }
.split-cell.add { background: color-mix(in srgb, var(--success) 13%, transparent); }
.split-cell.del { background: color-mix(in srgb, var(--danger) 14%, transparent); }
.split-cell.empty { background: rgba(128,128,128,.05); }
.split-cell .dtxt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.diff-rows.wrap .split-cell .dtxt { overflow: visible; text-overflow: clip; white-space: pre-wrap; overflow-wrap: anywhere; }

/* PR Conversation & Merge Card */
.conv-col { max-width: 720px; display: flex; flex-direction: column; gap: 12px; }
.comment-card {
  flex: none; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--raised);
}
.comment-head {
  display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px;
  border-bottom: 1px solid var(--row-div); font-size: 12px;
}
.comment-body { padding: 11px 13px; font-size: 13px; line-height: 1.55; }
.comment-body p { margin: 0 0 8px; }
.comment-body p:last-child { margin-bottom: 0; }
.ref-link {
  border: 0; background: transparent; padding: 0; color: var(--accent);
  font: 600 inherit var(--sans); cursor: pointer;
}
.ref-link:hover { text-decoration: underline; }
.tl-event {
  display: flex; align-items: center; gap: 8px; padding: 2px 10px;
  font-size: 12px; color: var(--muted);
}

.merge-card {
  flex: none;
  border: 1px solid color-mix(in srgb, var(--success) 35%, var(--border));
  border-radius: 13px; padding: 13px 14px; background: var(--raised);
  display: flex; flex-direction: column; gap: 10px;
}
.merge-status { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; color: var(--success); }
.merge-textarea {
  width: 100%; min-height: 76px; resize: vertical; padding: 9px 11px;
  border-radius: 9px; border: 1px solid var(--border-strong);
  background: var(--code-bg); color: var(--text); font: 12px/1.45 var(--sans);
}
.md-composer {
  flex: none; border: 1px solid var(--border); border-radius: 12px; background: var(--raised); overflow: hidden;
}
.md-bar {
  display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
  padding: 6px 10px; border-bottom: 1px solid var(--row-div);
}
.fmt-tools { display: flex; align-items: center; gap: 2px; }
.fmt-tools button {
  width: 26px; height: 26px; border: 0; border-radius: 6px;
  background: transparent; color: var(--muted); font: 650 12px/1 inherit; cursor: pointer;
  display: grid; place-items: center;
}
.fmt-tools button:hover { background: var(--hover); color: var(--text); }
.md-composer textarea {
  width: 100%; min-height: 74px; border: 0; padding: 10px 12px;
  background: transparent; color: var(--text); font: inherit; font-size: 12.5px; resize: vertical; outline: none;
}
.md-comp-foot {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 7px 10px; border-top: 1px solid var(--row-div);
}

/* Commits Graph & List */
.commit-row {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto;
  column-gap: 10px; align-items: center; width: 100%;
  min-height: 48px; padding: 4px 10px; border: 0; border-radius: 12px;
  background: transparent; color: var(--text); font: inherit; text-align: left; cursor: pointer;
}
.commit-row:hover { background: var(--hover); }
.commit-row.selected { background: var(--tonal); color: var(--on-tonal); }
.commit-row.selected .sha-pill { background: rgba(255,255,255,.16); color: inherit; }
.commit-row.selected .muted { color: color-mix(in srgb, var(--on-tonal) 80%, transparent); }
.commit-main { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.commit-subj {
  display: flex; align-items: center; gap: 6px; min-width: 0;
  font-size: 13px; font-weight: 600;
}
.commit-subj > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.commit-sub {
  display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--muted);
  white-space: nowrap; overflow: hidden;
}
.commit-end { display: flex; align-items: center; gap: 8px; flex: none; }
.lanes-svg { display: block; flex: none; }

/* Branches & Tags */
.group-card {
  border: 1px solid var(--border); border-radius: 13px; overflow: hidden;
  background: var(--raised); margin-bottom: 14px;
}
.group-card > h3 {
  margin: 0; padding: 8px 14px; font-size: 11.8px; font-weight: 630;
  color: var(--muted); border-bottom: 1px solid var(--row-div); background: var(--panel);
}
.b-row {
  display: grid; grid-template-columns: 16px minmax(0, 1fr) auto auto;
  gap: 12px; align-items: center; padding: 10px 14px;
  border-top: 1px solid var(--row-div);
}
.b-row:first-of-type { border-top: 0; }
.b-main { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.b-name { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; font: 600 12.5px/1.2 var(--mono); }
.b-meta { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.div-meter {
  display: grid; grid-template-columns: 56px 1px 56px; gap: 6px; align-items: center;
  font-size: 10.5px; color: var(--muted);
}
.div-spine { width: 1px; height: 22px; background: var(--border-strong); }
.div-side { display: flex; flex-direction: column; gap: 3px; }
.div-side.beh { align-items: flex-end; }
.div-bar { height: 5px; border-radius: 3px; }
.div-side.beh .div-bar { background: var(--dim); }
.div-side.ahd .div-bar { background: var(--accent); }
.w0 { width: 3px; opacity: .35; } .w2 { width: 22px; } .w3 { width: 34px; } .w5 { width: 52px; }

/* Right Drawer Sheet (Commit / Issue / Compare / Labels / Settings) */
.drawer {
  display: flex; flex-direction: column; min-width: 0; min-height: 0;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 16px; overflow: hidden;
}
.drawer-head {
  display: flex; align-items: center; gap: 6px; min-height: 48px;
  padding: 6px 10px 6px 16px; border-bottom: 1px solid var(--border); flex: none;
}
.drawer-head h2 { margin: 0; flex: 1; font-size: 14.5px; font-weight: 640; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.drawer-body {
  flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: thin;
  padding: 14px; display: flex; flex-direction: column; gap: 12px;
}

/* Fixed Labels Color Grid (no hanging text!) */
.lbl-row {
  display: grid; grid-template-columns: 118px minmax(0, 1fr) auto;
  gap: 12px; align-items: center; padding: 10px 14px;
  border-top: 1px solid var(--row-div);
}
.lbl-row:first-of-type { border-top: 0; }
.color-grid {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px;
}
.color-chip {
  display: flex; align-items: center; gap: 7px;
  height: 32px; padding: 0 9px; border-radius: 9px;
  border: 1px solid var(--border); background: var(--raised);
  color: var(--text); font: 550 12px/1 inherit; cursor: pointer;
}
.color-chip:hover { background: var(--hover); }
.color-chip.active {
  border-color: var(--accent); background: var(--tonal); color: var(--on-tonal); font-weight: 620;
}
.color-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }

/* Settings Sheet Rows */
.set-group {
  border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--raised);
}
.set-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 10px 12px; border-top: 1px solid var(--row-div);
}
.set-row:first-child { border-top: 0; }
.set-row strong { display: block; font-size: 12.5px; font-weight: 600; }
.set-row small { display: block; font-size: 11px; color: var(--muted); }
.switch {
  width: 34px; height: 20px; border-radius: 999px; border: 0; padding: 2px;
  background: var(--hover); cursor: pointer; position: relative; flex: none;
  transition: background .12s;
}
.switch::after {
  content: ""; display: block; width: 16px; height: 16px; border-radius: 50%;
  background: var(--muted); transition: transform .12s, background .12s;
}
.switch.on { background: var(--accent); }
.switch.on::after { transform: translateX(14px); background: var(--on-accent); }

.sc-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.sc-table td { padding: 7px 4px; border-top: 1px solid var(--row-div); }
.sc-table tr:first-child td { border-top: 0; }
.sc-table td:last-child { text-align: right; }
.kcap {
  display: inline-grid; place-items: center; min-width: 22px; height: 21px; padding: 0 5px;
  border-radius: 5px; border: 1px solid var(--border); background: var(--panel);
  font: 600 10.5px/1 var(--mono);
}

/* Issues rows */
.issue-row {
  display: grid; grid-template-columns: 18px minmax(0, 1fr) auto;
  gap: 10px; align-items: start; width: 100%; padding: 10px 12px;
  border: 0; border-radius: 12px; background: transparent; color: var(--text);
  font: inherit; text-align: left; cursor: pointer;
}
.issue-row:hover { background: var(--hover); }
.issue-row.selected { background: var(--tonal); color: var(--on-tonal); }
.issue-row.selected .muted { color: color-mix(in srgb, var(--on-tonal) 80%, transparent); }
.issue-title-line { display: flex; align-items: center; flex-wrap: wrap; gap: 5px 7px; font-size: 13px; font-weight: 610; }
.issue-sub { font-size: 11.5px; color: var(--muted); margin-top: 3px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

/* Responsive adaptation for 728px T3 inline view + Phone 390px mode */
@media (max-width: 979px) {
  .workspace { grid-template-columns: 186px minmax(0, 1fr); }
  .main-area.with-drawer { grid-template-columns: minmax(0, 1fr) 292px; }
  .attention-strip { grid-template-columns: 1fr; }
  .ov-grid { grid-template-columns: 1fr; }

  .pr-files-layout { grid-template-columns: 152px minmax(0, 1fr); }
  .div-meter, .b-note { display: none; }
  .b-row { grid-template-columns: 16px minmax(0, 1fr) auto; }
  .commit-end .stat-added, .commit-end .stat-removed { display: none; }
}

/* Phone preview mode (via button OR narrow <620px viewport) */
.stage[data-viewport="phone"] {
  max-width: 374px;
  height: 700px;
  margin: 0 auto;
  border-radius: 28px;

.stage[data-viewport="phone"] .tb-start { display: none; }

.stage[data-viewport="phone"] .tb-search { flex: 1; margin: 0; }
.stage[data-viewport="phone"] .tb-search kbd,
.stage[data-viewport="phone"] .tb-end .ib { display: none; }
.stage[data-viewport="phone"] .workspace {

  box-shadow: 12px 0 36px rgba(0,0,0,.45);

}
.stage[data-viewport="phone"].drawer-open .sidebar { display: flex; }
.stage[data-viewport="phone"] .main-area.with-drawer { grid-template-columns: minmax(0, 1fr); }
.stage[data-viewport="phone"] .main-area.with-drawer .sheet { display: none; }
.stage[data-viewport="phone"] .attention-strip,
.stage[data-viewport="phone"] .ov-grid,
.stage[data-viewport="phone"] .code-grid,
.stage[data-viewport="phone"] .reader-layout,
.stage[data-viewport="phone"] .pr-files-layout { grid-template-columns: 1fr; }
.stage[data-viewport="phone"] .file-tree-pane,
.stage[data-viewport="phone"] .pr-files-rail { display: none; }
.stage[data-viewport="phone"] .file-table td:nth-child(2) { display: none; }
.stage[data-viewport="phone"] .b-row { grid-template-columns: 16px minmax(0, 1fr) auto; }
.stage[data-viewport="phone"] .div-meter { display: none; }
.stage[data-viewport="phone"] .split-grid { grid-template-columns: 1fr; }
.stage[data-viewport="phone"] .commit-end .stat-added,
.stage[data-viewport="phone"] .commit-end .stat-removed { display: none; }

@media (max-width: 619px) {

function renderHeatmapCells() {
  const levels = [0,0,0,1,0,2,0,0,1,3,0,2,1,0,0,0,1,2,4,1,0,3,2,1,0,4,3,2];
  const cells = [];
  for (let i = 0; i < 53 * 7; i++) {
    const recentBoost = i > 315 ? ((i * 7) % 5) : (i % 13 === 0 ? 1 : (i % 29 === 0 ? 2 : 0));
    const lv = i > 368 ? 'future' : 'l' + (i > 340 ? Math.min(4, levels[i % levels.length]) : recentBoost);
    const dayNum = (i % 28) + 1;
    const months = ['Dec','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov'];
    const m = months[Math.min(11, Math.floor(i / 31))];
    const cnt = lv === 'future' ? 0 : lv === 'l0' ? 0 : Number(lv.slice(1));
    cells.push(`<i class="${lv}" data-heat="${cnt} commit${cnt === 1 ? '' : 's'} on ${m} ${dayNum}"></i>`);
  }
  const monthsHdr = ['Dec','','','','Jan','','','','Feb','','','','Mar','','','','Apr','','','','','May','','','','Jun','','','','Jul','','','','Aug','','','','Sep','','','','Oct','','','','','Nov','','','','','','']
    .map(m => `<span>${m}</span>`).join('');
  return { cells: cells.join(''), monthsHdr };
}

function renderDiffCard(f) {
  const open = state.diffExpanded.has(f.file);
  let body = '';
  if (open) {
    if (state.diffMode === 'split') {
      const rows = [];
      let i = 0;
      while (i < f.lines.length) {
        const cur = f.lines[i];
        if (cur.t === 'ctx') {
          rows.push(`<div class="split-cell"><span class="dnum">${cur.o}</span><span class="dsign"> </span><span class="dtxt">${escHtml(cur.x)}</span></div>`);
          rows.push(`<div class="split-cell"><span class="dnum">${cur.n}</span><span class="dsign"> </span><span class="dtxt">${escHtml(cur.x)}</span></div>`);
          i++;
        } else if (cur.t === 'del' && f.lines[i+1]?.t === 'add') {
          const nxt = f.lines[i+1];
          rows.push(`<div class="split-cell del"><span class="dnum">${cur.o}</span><span class="dsign">-</span><span class="dtxt">${escHtml(cur.x)}</span></div>`);
          rows.push(`<div class="split-cell add"><span class="dnum">${nxt.n}</span><span class="dsign">+</span><span class="dtxt">${escHtml(nxt.x)}</span></div>`);
          i += 2;
        } else if (cur.t === 'del') {
          rows.push(`<div class="split-cell del"><span class="dnum">${cur.o}</span><span class="dsign">-</span><span class="dtxt">${escHtml(cur.x)}</span></div>`);
          rows.push(`<div class="split-cell empty"><span class="dnum"></span><span class="dsign"></span><span class="dtxt"> </span></div>`);
          i++;
        } else {
          rows.push(`<div class="split-cell empty"><span class="dnum"></span><span class="dsign"></span><span class="dtxt"> </span></div>`);
          rows.push(`<div class="split-cell add"><span class="dnum">${cur.n}</span><span class="dsign">+</span><span class="dtxt">${escHtml(cur.x)}</span></div>`);
          i++;
        }
      }
      body = `
        <div class="diff-rows ${state.diffWrap ? 'wrap' : ''}">
          <div class="dline hunk"><span class="dnum"></span><span class="dtxt">${escHtml(f.hunk)}</span></div>
          <div class="split-grid">${rows.join('')}</div>
        </div>
      `;
    } else {
      body = `
        <div class="diff-rows ${state.diffWrap ? 'wrap' : ''}">
          <div class="dline hunk"><span class="dnum"></span><span class="dnum"></span><span class="dsign"></span><span class="dtxt">${escHtml(f.hunk)}</span></div>
          ${f.lines.map(l => `
            <div class="dline ${l.t}">
              <span class="dnum">${l.o}</span>
              <span class="dnum">${l.n}</span>
              <span class="dsign">${l.t === 'add' ? '+' : l.t === 'del' ? '-' : ' '}</span>
              <span class="dtxt">${escHtml(l.x) || ' '}</span>
            </div>
          `).join('')}
        </div>
      `;
    }
  }
  return `
    <article class="diff-card">
      <div class="diff-card-head" data-toggle-diff="${f.file}">
        ${iconSvg(open ? 'chevd' : 'chev')}
        <span class="path">${f.file}</span>
        <span class="kind-pill ${f.kindCls}">${f.kind}</span>
        <span class="stat-added">+${f.add}</span>
        ${f.rem ? `<span class="stat-removed">−${f.rem}</span>` : ''}
        <button class="viewed-pill ${f.viewed ? 'on' : ''}" data-mark-viewed="${f.file}">${f.viewed ? '✓ Viewed' : 'Viewed'}</button>
      </div>
      ${body}
    </article>
  `;
}

function escHtml(s) {
  return s.replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;');
}

function render() {
  const hasDrawer = (
    (state.view === 'commits' && state.commitDrawerOpen) ||
    (state.view === 'issues' && state.issueDrawerOpen) ||
    state.view === 'settings' ||
    (state.view === 'branches' && state.branchSubTab === 'branches' && state.compareOpen)
  );
  const narrow = window.innerWidth <= 979;
  const autoFold = ((state.view === 'file' || state.view === 'pr') && (state.focusMode || narrow)) || (hasDrawer && narrow);
  stage.dataset.sidebarFolded = String(autoFold || state.focusMode);

  mainArea.className = hasDrawer ? 'main-area with-drawer' : 'main-area';

  topCrumb.textContent = state.view === 'overview' ? '' : `/ ${repoObj().name}`;

  document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('active', b.dataset.view === state.view));
  document.querySelectorAll('[data-side]').forEach(b => b.classList.toggle('active', state.view === 'overview' && b.dataset.side === state.side));
  document.querySelectorAll('[data-repo]').forEach(b => b.classList.toggle('active', state.view !== 'overview' && b.dataset.repo === state.repoId));

  if (state.view === 'overview') mainArea.innerHTML = renderOverview();
  else if (state.view === 'code') mainArea.innerHTML = renderCode();
  else if (state.view === 'file') mainArea.innerHTML = renderFileReader();
  else if (state.view === 'pr') mainArea.innerHTML = renderPRReview();
  else if (state.view === 'commits') mainArea.innerHTML = renderCommits();
  else if (state.view === 'branches') mainArea.innerHTML = renderBranches();
  else if (state.view === 'issues') mainArea.innerHTML = renderIssues();
  else if (state.view === 'settings') mainArea.innerHTML = renderSettingsAndLabels();

  const hs = document.getElementById('heatScroll');
  if (hs) hs.scrollLeft = hs.scrollWidth;
}

/* Delegated event handling */
document.addEventListener('click', (e) => {
  const t = e.target;
  const viewBtn = t.closest('[data-view]');
  if (viewBtn) {
    state.view = viewBtn.dataset.view;
    state.focusMode = false;
    state.cloneOpen = false;
    render();
    return;
  }
  const themeBtn = t.closest('[data-theme-btn]');
  if (themeBtn) {
    stage.dataset.theme = themeBtn.dataset.themeBtn;
    document.querySelectorAll('[data-theme-btn]').forEach(b => b.classList.toggle('active', b === themeBtn));
    return;
  }
  if (t.closest('#vpToggle')) {
    const next = stage.dataset.viewport === 'phone' ? 'desktop' : 'phone';
    stage.dataset.viewport = next;
    stage.classList.remove('drawer-open');
    document.getElementById('vpToggle').classList.toggle('active', next === 'phone');
    render();
    return;
  }
  if (t.closest('#mobileNavBtn')) {
    stage.classList.toggle('drawer-open');
    return;
  }
  const sideBtn = t.closest('[data-side]');
  if (sideBtn) {
    state.side = sideBtn.dataset.side;
    if (state.side === 'pulls') state.view = 'pr';
    else if (state.side === 'agent') { state.view = 'branches'; state.branchSubTab = 'branches'; }
    else state.view = 'overview';
    stage.classList.remove('drawer-open');
    render();
    return;
  }
  const repoBtn = t.closest('[data-repo]');
  if (repoBtn) {
    state.repoId = repoBtn.dataset.repo;
    state.view = 'code';
    state.codePath = '';
    stage.classList.remove('drawer-open');
    render();
    return;
  }
  const jumpRepo = t.closest('[data-jump-repo]');
  if (jumpRepo) {
    state.repoId = jumpRepo.dataset.jumpRepo;
    state.showDirtyDemo = jumpRepo.dataset.dirtyOn === 'true';
    state.view = 'code';
    render();
    return;
  }
  const jumpView = t.closest('[data-jump-view]');
  if (jumpView) {
    state.view = jumpView.dataset.jumpView;
    render();
    return;
  }
  const jumpCommit = t.closest('[data-jump-commit]');
  if (jumpCommit) {
    state.selectedSha = jumpCommit.dataset.jumpCommit;
    state.commitDrawerOpen = true;
    state.view = 'commits';
    render();
    return;
  }
  const repoTab = t.closest('[data-repo-tab]');
  if (repoTab) {
    state.view = repoTab.dataset.repoTab;
    if (repoTab.dataset.branchSub) state.branchSubTab = repoTab.dataset.branchSub;
    state.focusMode = false;
    state.cloneOpen = false;
    render();
    return;
  }
  const brSub = t.closest('[data-branch-sub]');
  if (brSub) {
    state.branchSubTab = brSub.dataset.branchSub;
    state.view = 'branches';
    render();
    return;
  }
  const ovFilter = t.closest('[data-ov-filter]');
  if (ovFilter) { state.ovFilter = ovFilter.dataset.ovFilter; render(); return; }
  const ovSort = t.closest('[data-ov-sort]');
  if (ovSort) { state.ovSort = ovSort.dataset.ovSort; render(); return; }
  const codePath = t.closest('[data-code-path]');
  if (codePath) { state.codePath = codePath.dataset.codePath; render(); return; }
  const openFile = t.closest('[data-open-file]');
  if (openFile) { state.activeFile = openFile.dataset.openFile; state.view = 'file'; render(); return; }
  if (t.closest('#toggleDirtyDemo')) { state.showDirtyDemo = !state.showDirtyDemo; render(); return; }
  if (t.closest('#cloneBtn')) { state.cloneOpen = !state.cloneOpen; render(); return; }
  const cloneKind = t.closest('[data-clone-kind]');
  if (cloneKind) {
    const cmd = document.getElementById('cloneCmd');
    const r = repoObj();
    if (cmd) cmd.textContent = cloneKind.dataset.cloneKind === 'perm'
      ? `git clone https://dar.example/dav/git/5a1ba34c-5971.git`
      : `git clone https://dar.example/dav/git/anas/${r.path}.git`;
    cloneKind.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === cloneKind));
    return;
  }
  if (t.closest('#copyCloneBtn') || t.closest('#aboutCopyBtn') || t.closest('#copyCodeBtn')) {
    const btn = t.closest('button');
    const orig = btn.innerHTML;
    btn.innerHTML = `${iconSvg('check')}<span>Copied</span>`;
    setTimeout(() => { if (document.body.contains(btn)) btn.innerHTML = orig; }, 1100);
    return;
  }
  if (t.closest('#toggleTreeBtn')) { state.treeOpen = !state.treeOpen; render(); return; }
  if (t.closest('#fileWrapBtn')) { state.fileWrap = !state.fileWrap; render(); return; }
  const mdMode = t.closest('[data-md-mode]');
  if (mdMode) { state.mdRendered = mdMode.dataset.mdMode === 'rendered'; render(); return; }
  const ln = t.closest('[data-line-num]');
  if (ln) { state.anchorLine = Number(ln.dataset.lineNum); render(); return; }
  if (t.closest('#focusBtn')) { state.focusMode = !state.focusMode; render(); return; }
  const prTab = t.closest('[data-pr-tab]');
  if (prTab) { state.prTab = prTab.dataset.prTab; render(); return; }
  const diffMode = t.closest('[data-diff-mode]');
  if (diffMode) { state.diffMode = diffMode.dataset.diffMode; render(); return; }
  if (t.closest('#diffWrapBtn')) { state.diffWrap = !state.diffWrap; render(); return; }
  if (t.closest('#prRailBtn')) { state.prRailOpen = !state.prRailOpen; render(); return; }
  if (t.closest('#expandAllBtn')) { PR_DIFFS.forEach(d => state.diffExpanded.add(d.file)); render(); return; }
  const markViewed = t.closest('[data-mark-viewed]');
  if (markViewed) {
    e.stopPropagation();
    const d = PR_DIFFS.find(x => x.file === markViewed.dataset.markViewed);
    if (d) d.viewed = !d.viewed;
    render();
    return;
  }
  const togDiff = t.closest('[data-toggle-diff]');
  if (togDiff) {
    const f = togDiff.dataset.toggleDiff;
    if (state.diffExpanded.has(f)) state.diffExpanded.delete(f); else state.diffExpanded.add(f);
    render();
    return;
  }
  const mergeMode = t.closest('[data-merge-mode]');
  if (mergeMode) { state.mergeMode = mergeMode.dataset.mergeMode; render(); return; }
  const cMode = t.closest('[data-commits-mode]');
  if (cMode) { state.commitsMode = cMode.dataset.commitsMode; render(); return; }
  const selSha = t.closest('[data-select-sha]');
  if (selSha) { state.selectedSha = selSha.dataset.selectSha; state.commitDrawerOpen = true; render(); return; }
  if (t.closest('#closeCommitBtn')) { state.commitDrawerOpen = false; render(); return; }
  if (t.closest('#toggleCompareBtn') || t.closest('#toggleCompareBtn2')) { state.compareOpen = true; render(); return; }
  if (t.closest('#closeCompareBtn')) { state.compareOpen = false; render(); return; }
  const selIss = t.closest('[data-sel-issue]');
  if (selIss) { state.selectedIssue = Number(selIss.dataset.selIssue); state.issueDrawerOpen = true; render(); return; }
  if (t.closest('#closeIssueBtn')) { state.issueDrawerOpen = false; render(); return; }
  const issState = t.closest('[data-iss-state]');
  if (issState) { state.issueFilter = issState.dataset.issState; render(); return; }
  const setTab = t.closest('[data-set-tab]');
  if (setTab) { state.settingsTab = setTab.dataset.setTab; state.view = 'settings'; render(); return; }
  if (t.closest('#topSettingsBtn')) { state.settingsTab = 'general'; state.view = 'settings'; render(); return; }
  if (t.closest('#topShortcutsBtn')) { state.settingsTab = 'keys'; state.view = 'settings'; render(); return; }
  if (t.closest('#credBtn') || t.closest('[data-jump-settings]')) { state.settingsTab = 'labels'; state.view = 'settings'; render(); return; }
  const lblColor = t.closest('[data-lbl-color]');
  if (lblColor) { state.labelColor = lblColor.dataset.lblColor; render(); return; }
  const prefDiff = t.closest('[data-pref-diff]');
  if (prefDiff) { state.settings.diff = prefDiff.dataset.prefDiff; state.diffMode = state.settings.diff; render(); return; }
  const prefCommits = t.closest('[data-pref-commits]');
  if (prefCommits) { state.settings.commits = prefCommits.dataset.prefCommits; state.commitsMode = state.settings.commits; render(); return; }
  if (t.closest('#prefWrap')) { state.settings.wrap = !state.settings.wrap; state.diffWrap = state.settings.wrap; render(); return; }
  if (t.closest('#prefAbout')) { state.settings.about = !state.settings.about; render(); return; }
});

document.addEventListener('change', (e) => {
  const chk = e.target.closest('[data-chk-viewed]');
  if (chk) {
    const d = PR_DIFFS.find(x => x.file === chk.dataset.chkViewed);
    if (d) d.viewed = chk.checked;
    render();
  }
});

document.addEventListener('input', (e) => {
  if (e.target.id === 'codeFilterInput') {
    state.codeFilter = e.target.value;
    render();
    const inp = document.getElementById('codeFilterInput');
    if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
  }
});

document.addEventListener('mouseover', (e) => {
  const cell = e.target.closest('[data-heat]');
  if (cell) {
    const tip = document.getElementById('heatTip');
    if (tip) tip.textContent = cell.dataset.heat;
  }
});

window.addEventListener('resize', () => {
  render();
});

render();
</script>
</body>
</html>
