<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dar Prayer Times — Rust Port, Redesign &amp; Daily Tracking Mockup</title>
<style>
*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  font-family: var(--font-sans, 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif);
  font-size: 12.5px;
  line-height: 1.45;
  color: var(--foreground, #faeaf3);
  -webkit-font-smoothing: antialiased;
}

.mock-shell { display: flex; flex-direction: column; gap: 8px; width: 100%; }
.mock-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px; }
.mock-group { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.mock-btn {
  appearance: none;
  border: 1px solid var(--border, rgba(186,150,178,.28));
  background: var(--secondary, rgba(115,57,111,.10));
  color: var(--muted-foreground, #b89eb4);
  font: 550 10.5px/1 inherit;
  padding: 5.5px 8.5px;
  border-radius: 8px;
  cursor: pointer;
  white-space: nowrap;
  transition: background .12s, color .12s, border-color .12s;
}
.mock-btn:hover { color: var(--foreground, #faeaf3); background: rgba(115,57,111,.20); }
.mock-btn.active { background: #73396f; color: #fff7fc; border-color: transparent; font-weight: 600; }

/* Dar Twilight Stage (Nightfall dark default, Afterglow light) */
.stage {
  --bg: #26111f;
  --panel: #301c2b;
  --raised: #3a2536;
  --hover: #412b3f;
  --border: rgba(186, 150, 178, 0.22);
  --border-strong: rgba(186, 150, 178, 0.36);
  --row-div: rgba(186, 150, 178, 0.13);
  --text: #faeaf3;
  --muted: #cfb4ca;
  --dim: #9d8098;
  --accent: #f2a2a9;
  --on-accent: #26111f;
  --tonal: #4d3c73;
  --on-tonal: #f3eafd;
  --rose: #d889af;
  --solar: #ffc493;
  --solar-soft: rgba(255, 196, 147, 0.16);
  --dawn: #cbb7f7;
  --success: #b2dec4;
  --success-soft: rgba(178, 222, 196, 0.16);
  --danger: #ffb2c6;
  --error-soft: #4e2436;
  --shadow: 0 14px 36px rgba(10, 3, 10, 0.48), 0 2px 8px rgba(10, 3, 10, 0.28);
  --mono: var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace);

  position: relative;
  width: 100%;
  height: 644px;
  border-radius: var(--radius, 14px);
  overflow: hidden;
  border: 1px solid var(--border-strong);
  background: var(--bg);
  color: var(--text);
  display: grid;
  grid-template-rows: 44px minmax(0, 1fr);
  box-shadow: var(--shadow);
  color-scheme: dark;
}
.stage[data-theme="light"] {
  color-scheme: light;
  --bg: #fbf4f6;
  --panel: #fffafb;
  --raised: #ffffff;
  --hover: #f3e7ee;
  --border: rgba(115, 57, 111, 0.17);
  --border-strong: rgba(115, 57, 111, 0.30);
  --row-div: rgba(115, 57, 111, 0.10);
  --text: #352138;
  --muted: #6e546d;
  --dim: #8c718b;
  --accent: #73396f;
  --on-accent: #fff7fc;
  --tonal: #ede3f5;
  --on-tonal: #4d3c73;
  --rose: #a94a76;
  --solar: #9a5516;
  --solar-soft: rgba(154, 85, 22, 0.12);
  --dawn: #5b4399;
  --success: #246144;
  --success-soft: rgba(36, 97, 68, 0.12);
  --danger: #a32745;
  --error-soft: #fbe9ee;
  --shadow: 0 12px 30px rgba(38, 17, 31, 0.12), 0 2px 6px rgba(38, 17, 31, 0.06);
}

.hidden { display: none !important; }
.num { font-variant-numeric: tabular-nums; }
svg.ic {
  width: 14px; height: 14px; flex: none;
  fill: none; stroke: currentColor; stroke-width: 1.75;
  stroke-linecap: round; stroke-linejoin: round;
}

/* Shared Dar Full-Canvas Topbar */
.topbar { display: flex; align-items: center; gap: 8px; padding: 0 10px; min-width: 0; }
.tb-start { display: flex; align-items: center; gap: 6px; flex: none; }
.dar-mark {
  display: grid; place-items: center; width: 26px; height: 26px; border-radius: 8px;
  background: var(--accent); color: var(--on-accent); font-size: 13px; font-weight: 760;
}
.tb-title { font-size: 14px; font-weight: 630; letter-spacing: -.015em; }
.tb-search {
  flex: 0 1 280px; margin: 0 auto; min-width: 0; height: 30px; padding: 0 7px 0 11px;
  border-radius: 15px; border: 1px solid var(--border); background: var(--panel); color: var(--muted);
  display: flex; align-items: center; gap: 7px; font-size: 11px;
}
.tb-search span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tb-search kbd { margin-left: auto; font: 550 9px/14px var(--mono); padding: 0 4.5px; border-radius: 4px; border: 1px solid var(--border); color: var(--muted); flex: none; }
.tb-end { display: flex; align-items: center; gap: 4px; flex: none; }
.ib {
  display: inline-grid; place-items: center; width: 28px; height: 28px; border: 0; border-radius: 8px;
  background: transparent; color: var(--muted); cursor: pointer; flex: none; transition: background .1s, color .1s;
}
.ib:hover { background: var(--hover); color: var(--text); }
.ib.on { background: var(--tonal); color: var(--on-tonal); }
.avatar { width: 26px; height: 26px; border-radius: 50%; flex: none; display: inline-grid; place-items: center; background: var(--tonal); color: var(--on-tonal); font-size: 10px; font-weight: 680; }

/* Workspace */
.workspace { display: grid; grid-template-columns: 138px minmax(0, 1fr) 216px; gap: 8px; padding: 0 8px 8px; min-height: 0; overflow: hidden; position: relative; }
.workspace.no-right { grid-template-columns: 138px minmax(0, 1fr); }
.workspace.wide-right { grid-template-columns: 130px minmax(0, 1fr) 244px; }
.workspace.phone-stage { grid-template-columns: minmax(0, 1fr); padding: 8px; }

/* Sidebar */
.sidebar { display: flex; flex-direction: column; min-height: 0; padding: 2px 0 0 2px; overflow: hidden; }
.create-btn {
  display: inline-flex; align-items: center; gap: 6px; align-self: flex-start;
  height: 34px; padding: 0 11px 0 9px; margin: 0 0 8px 1px; border: 0; border-radius: 12px;
  background: var(--tonal); color: var(--on-tonal); font: 600 11.2px/1 inherit; cursor: pointer;
  box-shadow: 0 1px 3px rgba(0,0,0,.15);
}
.create-btn:hover { filter: brightness(1.07); }
.side-scroll { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: thin; }
.nav-list { display: flex; flex-direction: column; gap: 1px; }
.nav-item {
  display: flex; align-items: center; gap: 7px; width: 100%; height: 29px; padding: 0 8px;
  border: 0; border-radius: 14px; background: transparent; color: var(--text);
  font: 500 11.3px/1 inherit; text-align: left; cursor: pointer;
}
.nav-item:hover { background: var(--hover); }
.nav-item.active { background: var(--tonal); color: var(--on-tonal); font-weight: 600; }
.nav-item svg.ic { color: var(--muted); width: 13px; height: 13px; }
.nav-item.active svg.ic { color: var(--on-tonal); }
.nav-lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-meta { font-size: 9px; color: var(--muted); flex: none; }
.nav-item.active .nav-meta { color: var(--on-tonal); opacity: .82; }
.side-head { display: flex; align-items: center; justify-content: space-between; margin: 10px 4px 3px 8px; font-size: 10.2px; font-weight: 600; color: var(--muted); }
.loc-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; border: 1.5px solid var(--muted); }
.nav-item.active .loc-dot { background: var(--accent); border-color: var(--accent); }

/* Sidebar MiniMonth with tracking dots */
.mini-month { margin-top: 10px; padding: 9px 4px 4px; border-top: 1px solid var(--row-div); }
.mm-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; padding: 0 2px; font-size: 10.2px; font-weight: 620; color: var(--text); }
.mm-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; text-align: center; font-size: 9px; }
.mm-dow { color: var(--dim); font-weight: 600; padding-bottom: 2px; }
.mm-day {
  position: relative; border: 0; background: transparent; color: var(--muted);
  height: 20px; border-radius: 9px; font: 500 9.2px/18px inherit; cursor: pointer; padding: 0 0 2px;
}
.mm-day:hover { background: var(--hover); color: var(--text); }
.mm-day.is-today { background: var(--accent); color: var(--on-accent); font-weight: 700; }
.mm-day.is-sel:not(.is-today) { box-shadow: inset 0 0 0 1.4px var(--accent); color: var(--text); font-weight: 600; }
.mm-dot {
  position: absolute; left: 50%; bottom: 1.5px; transform: translateX(-50%);
  width: 3.5px; height: 3.5px; border-radius: 50%;
}
.mm-dot.ok { background: var(--success); }
.mm-dot.mix { background: var(--solar); }
.mm-day.is-today .mm-dot { background: var(--on-accent); opacity: .75; }

/* Floating Sheets */
.sheet {
  background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
  display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; position: relative;
}
.sheet-head { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--row-div); flex: none; min-width: 0; }
.sheet-head-title { min-width: 0; flex: 1; }
.sheet-head h1 { margin: 0; font-size: 14px; font-weight: 650; letter-spacing: -.015em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sheet-sub { font-size: 10.2px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sheet-actions { display: flex; align-items: center; gap: 4px; flex: none; }
.pill-btn {
  display: inline-flex; align-items: center; gap: 4px; height: 25px; padding: 0 9px;
  border: 1px solid var(--border); border-radius: 13px; background: transparent; color: var(--text);
  font: 560 10.4px/1 inherit; cursor: pointer; white-space: nowrap;
}
.pill-btn:hover { background: var(--hover); }
.pill-btn.tonal { background: var(--tonal); color: var(--on-tonal); border-color: transparent; }
.pill-btn.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; font-weight: 620; }
.pill-btn svg.ic { width: 12px; height: 12px; }
.seg { display: inline-flex; padding: 2px; gap: 2px; border-radius: 10px; background: var(--hover); }
.seg button { border: 0; background: transparent; color: var(--muted); height: 21px; padding: 0 7px; border-radius: 8px; font: 550 10px/1 inherit; cursor: pointer; }
.seg button.active { background: var(--panel); color: var(--text); font-weight: 620; box-shadow: 0 1px 2px rgba(0,0,0,.18); }
.sheet-body { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: thin; padding: 10px 12px 12px; }

/* Solar Horizon Stage */
.solar-stage {
  position: relative; border: 1px solid var(--border); border-radius: 13px;
  background: linear-gradient(180deg, color-mix(in srgb, var(--tonal) 26%, var(--raised)) 0%, var(--raised) 68%, color-mix(in srgb, var(--bg) 52%, var(--panel)) 100%);
  padding: 10px 12px 8px; margin-bottom: 9px;
}
.hero-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 3px; }
.hero-phase { display: inline-flex; align-items: center; gap: 5px; padding: 2px 7.5px; border-radius: 999px; background: var(--solar-soft); color: var(--solar); font-size: 9.7px; font-weight: 600; margin-bottom: 4px; }
.hero-phase-dot { width: 5.5px; height: 5.5px; border-radius: 50%; background: currentColor; }
.hero-title { margin: 0; font-size: 19px; font-weight: 680; letter-spacing: -.022em; line-height: 1.12; }
.hero-window-note { margin: 2px 0 0; font-size: 10px; color: var(--muted); white-space: nowrap; }
.hero-cd { text-align: right; flex: none; }
.hero-cd small { display: block; font-size: 9.5px; color: var(--muted); font-weight: 540; }
.hero-cd strong { display: block; font-size: 18px; font-weight: 680; color: var(--accent); letter-spacing: -.02em; line-height: 1.12; }
.window-bar { margin-top: 3.5px; width: 84px; height: 3.5px; margin-left: auto; border-radius: 999px; background: var(--hover); overflow: hidden; }
.window-bar-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--solar), var(--accent)); }
.solar-svg { display: block; width: 100%; height: 74px; overflow: visible; }
.arc-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 2px; margin-top: 1px; padding-top: 4px; border-top: 1px solid var(--row-div); text-align: center; }
.arc-cell { display: flex; flex-direction: column; align-items: center; gap: 0.5px; padding: 2px 1px; border-radius: 6px; }
.arc-cell.is-now { background: var(--solar-soft); }
.arc-cell.is-next { background: var(--tonal); color: var(--on-tonal); }
.arc-cell span { font-size: 9px; color: var(--muted); font-weight: 560; display: inline-flex; align-items: center; gap: 3px; }
.arc-cell.is-next span { color: var(--on-tonal); opacity: .88; }
.arc-cell.is-now span { color: var(--solar); }
.arc-cell strong { font-size: 9.6px; font-weight: 620; }
.arc-cell.is-past { opacity: .72; }
.arc-st-dot { width: 4.5px; height: 4.5px; border-radius: 50%; display: inline-block; }
.arc-st-dot.on_time { background: var(--success); }
.arc-st-dot.late { background: var(--solar); }

/* Today Timetable with Prayer Tracking Pills */
.prayer-list { display: flex; flex-direction: column; gap: 2.5px; }
.p-row {
  display: grid; grid-template-columns: 24px minmax(0, 1fr) auto auto;
  align-items: center; gap: 7px;
  padding: 5.5px 8px; border-radius: 10px;
  border: 1px solid transparent; transition: background .1s;
}
.p-row:hover { background: var(--hover); }
.p-row.is-past { color: var(--muted); }
.p-row.is-now { background: var(--solar-soft); border-color: color-mix(in srgb, var(--solar) 34%, transparent); }
.p-row.is-next { background: var(--tonal); color: var(--on-tonal); }
.p-ico { width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; background: var(--hover); color: var(--muted); }
.p-ico svg.ic { width: 13px; height: 13px; }
.p-row.is-now .p-ico { background: color-mix(in srgb, var(--solar) 22%, transparent); color: var(--solar); }
.p-row.is-next .p-ico { background: color-mix(in srgb, var(--on-tonal) 16%, transparent); color: var(--on-tonal); }
.p-row.is-solar .p-ico { border: 1px dashed var(--border-strong); background: transparent; }
.p-name { display: flex; flex-direction: column; min-width: 0; }
.p-name strong { font-size: 11.8px; font-weight: 610; display: flex; align-items: center; gap: 5px; line-height: 1.2; }
.p-name small { font-size: 9.6px; color: var(--muted); line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p-row.is-next .p-name small { color: var(--on-tonal); opacity: .82; }
.p-badge { font-size: 8.6px; font-weight: 620; padding: 1px 5px; border-radius: 999px; background: var(--hover); color: var(--muted); }
.p-row.is-now .p-badge { background: color-mix(in srgb, var(--solar) 24%, transparent); color: var(--solar); }
.p-row.is-next .p-badge { background: var(--accent); color: var(--on-accent); }
.p-time { font-size: 12px; font-weight: 640; text-align: right; white-space: nowrap; }
.p-row.is-past .p-time { font-weight: 520; }

/* Prayer Tracking Morphing Icon Button (unprayed / on_time / late) */
.track-ico {
  display: inline-grid; place-items: center;
  width: 28px; height: 28px; padding: 0; flex: none;
  border-radius: 9px; border: 1px solid var(--border);
  background: transparent; color: var(--dim);
  cursor: pointer;
  transition: background .12s, color .12s, border-color .12s, transform .1s;
}
.track-ico:hover { border-color: var(--border-strong); background: var(--hover); color: var(--text); }
.track-ico:active { transform: scale(.93); }
.track-ico svg.ic { width: 14px; height: 14px; }
.track-ico.is-on_time {
  background: var(--success-soft); color: var(--success);
  border-color: color-mix(in srgb, var(--success) 44%, transparent);
}
.track-ico.is-on_time:hover { background: color-mix(in srgb, var(--success) 24%, transparent); }
.track-ico.is-late {
  background: var(--solar-soft); color: var(--solar);
  border-color: color-mix(in srgb, var(--solar) 48%, transparent);
}
.track-ico.is-late:hover { background: color-mix(in srgb, var(--solar) 24%, transparent); }
.p-row.is-next .track-ico:not(.is-on_time):not(.is-late) {
  border-color: color-mix(in srgb, var(--on-tonal) 30%, transparent);
  color: color-mix(in srgb, var(--on-tonal) 78%, transparent);
}
.p-row.is-next .track-ico:not(.is-on_time):not(.is-late):hover {
  background: color-mix(in srgb, var(--on-tonal) 14%, transparent);
  color: var(--on-tonal);
}
.track-spacer { width: 28px; flex: none; display: inline-block; }
.ico-legend {
  display: flex; align-items: center; justify-content: space-between; gap: 6px;
  margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--row-div);
  font-size: 9px; color: var(--muted);
}
.ico-legend span { display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
.ico-legend i { display: inline-flex; align-items: center; }
.ico-legend svg.ic { width: 10.5px; height: 10.5px; }
.ico-legend .lg-ok { color: var(--success); }
.ico-legend .lg-late { color: var(--solar); }
.ico-legend .lg-none { color: var(--dim); }

.caveat { margin: 7px 2px 0; font-size: 9.5px; color: var(--dim); display: flex; align-items: center; justify-content: space-between; gap: 8px; }

/* Right Cards & Daily Log */
.ctx-card { border: 1px solid var(--border); border-radius: 12px; background: var(--raised); padding: 9px 10px; margin-bottom: 8px; }
.ctx-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 6px; }
.ctx-head h3 { margin: 0; font-size: 11px; font-weight: 630; color: var(--text); }
.ctx-link { border: 0; background: none; padding: 0; color: var(--accent); font: 580 9.8px/1 inherit; cursor: pointer; white-space: nowrap; }
.ctx-link:hover { text-decoration: underline; }

.log-summary { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px; }
.log-summary strong { font-size: 15px; font-weight: 700; }
.log-summary span { font-size: 9.8px; color: var(--muted); }
.log-strip { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-bottom: 8px; }
.log-seg {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  border: 0; background: transparent; padding: 0; cursor: pointer; color: var(--muted); font: inherit;
}
.log-seg-bar { width: 100%; height: 6px; border-radius: 999px; background: var(--hover); transition: background .12s; }
.log-seg.is-on_time .log-seg-bar { background: var(--success); }
.log-seg.is-late .log-seg-bar { background: var(--solar); }
.log-seg span { font-size: 9px; font-weight: 600; }
.log-seg.is-on_time span { color: var(--success); }
.log-seg.is-late span { color: var(--solar); }

.wk-dots {
  display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px;
  padding-top: 7px; border-top: 1px solid var(--row-div);
}
.wk-col {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 3px 0; border-radius: 7px; border: 0; background: transparent; cursor: pointer; font: inherit;
}
.wk-col:hover { background: var(--hover); }
.wk-col.is-today { background: var(--tonal); }
.wk-col small { font-size: 8.6px; color: var(--muted); font-weight: 600; }
.wk-col.is-today small { color: var(--on-tonal); }
.wk-pips { display: flex; flex-direction: column; gap: 2px; }
.pip { width: 5.5px; height: 5.5px; border-radius: 50%; background: var(--hover); border: 1px solid var(--border); }
.pip.on_time { background: var(--success); border-color: transparent; }
.pip.late { background: var(--solar); border-color: transparent; }
.pip-row { display: inline-flex; align-items: center; gap: 2.5px; }
.pip-sm { width: 5px; height: 5px; border-radius: 50%; background: var(--hover); border: 1px solid var(--border-strong); display: inline-block; }
.pip-sm.on_time { background: var(--success); border-color: transparent; }
.pip-sm.late { background: var(--solar); border-color: transparent; }

.qibla-mini { display: flex; align-items: center; gap: 9px; }
.qibla-dial-sm { width: 50px; height: 50px; flex: none; }
.qibla-meta strong { display: block; font-size: 13px; font-weight: 680; }
.qibla-meta span { display: block; font-size: 10px; color: var(--muted); margin-top: 1px; }
.qibla-meta small { display: block; font-size: 9.2px; color: var(--dim); margin-top: 1px; }

.kv-list { display: flex; flex-direction: column; }
.kv-row { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; padding: 4.5px 0; border-top: 1px solid var(--row-div); font-size: 10.5px; }
.kv-row:first-child { border-top: 0; padding-top: 0; }
.kv-row:last-child { padding-bottom: 0; }
.kv-k { color: var(--muted); }
.kv-v { font-weight: 600; text-align: right; white-space: nowrap; }
.kv-delta { color: var(--solar); font-size: 9.3px; font-weight: 560; margin-left: 3px; }

/* Day Inspector Direct 3-State Segmented Tracker */
.insp-row {
  display: flex; align-items: center; justify-content: space-between; gap: 5px;
  padding: 5.5px 0; border-top: 1px solid var(--row-div);
}
.insp-row:first-child { border-top: 0; padding-top: 0; }

function getLog(day) {
  if (!LOGS[day]) LOGS[day] = { fajr:'unprayed', dhuhr:'unprayed', asr:'unprayed', maghrib:'unprayed', isha:'unprayed' };
  return LOGS[day];
}
function logCounts(day) {
  const l = getLog(day);

  for (const k of OBLIG) { if (l[k] === 'on_time') on++; else if (l[k] === 'late') late++; }

}

}

function getLoc() { return LOCATIONS.find(l => l.id === state.locId) || LOCATIONS[0]; }
function shiftTimeStr(str, deltaMin) {
  const m = str.match(/(\d+):(\d+)\s*(AM|PM)/); if (!m) return str;
  let h = parseInt(m[1], 10), min = parseInt(m[2], 10);
  if (m[3] === 'PM' && h !== 12) h += 12; if (m[3] === 'AM' && h === 12) h = 0;
  let total = (h * 60 + min + deltaMin + 1440) % 1440, nh = Math.floor(total / 60), nm = total % 60;
  if (state.time24) return `${String(nh).padStart(2,'0')}:${String(nm).padStart(2,'0')}`;
  return `${nh % 12 || 12}:${String(nm).padStart(2,'0')} ${nh >= 12 ? 'PM' : 'AM'}`;
}

  const method = state.methodOverride || loc.method, asr = state.asrOverride || loc.asr, base = { ...loc.times };
  if (asr === 'hanafi') base.asr = loc.hanafiAsr;
  if (method === 'MWL' && loc.id === 'toronto') { base.fajr = loc.mwlFajr; base.isha = loc.mwlIsha; }
  const dm = dRow || { dF:0, dS:0, dD:0, dA:0, dM:0, dI:0 };
  return { fajr: shiftTimeStr(base.fajr, dm.dF + state.fajrOffset), sunrise: shiftTimeStr(base.sunrise, dm.dS), dhuhr: shiftTimeStr(base.dhuhr, dm.dD), asr: shiftTimeStr(base.asr, dm.dA), maghrib: shiftTimeStr(base.maghrib, dm.dM), isha: shiftTimeStr(base.isha, dm.dI) };
}

      const pips = state.showTracking && c.done > 0 ? `<span class="pip-row">${OBLIG.map(k=>`<i class="pip-sm ${dl[k]}"></i>`).join('')}</span>` : '';
      return `<tr class="${d.today?'is-today':''} ${state.selectedDay===d.day?'is-selected':''} ${d.jumuah?'is-jumuah':''}" data-pick-day="${d.day}">
        <th><span class="day-main">${d.short}</span><span class="day-sub">${d.today?'Today':d.hijri} ${pips}</span></th>
        <td class="num">${mark('fajr')}${dt.fajr.replace(/ [AP]M/,'')}${dot('fajr')}</td>
        <td class="num td-solar">${dt.sunrise.replace(/ [AP]M/,'')}</td>
        <td class="num">${mark('dhuhr')}${dt.dhuhr.replace(/ [AP]M/,'')}</td>
        <td class="num">${mark('asr')}${d.today?`<span class="next-pill">${dt.asr.replace(/ [AP]M/,'')}</span>`:dt.asr.replace(/ [AP]M/,'')}${dot('asr')}</td>
        <td class="num">${mark('maghrib')}${dt.maghrib.replace(/ [AP]M/,'')}</td>
        <td class="num">${mark('isha')}${dt.isha.replace(/ [AP]M/,'')}${dot('isha')}</td>
      </tr>`;
    }).join('')}</tbody></table></div>
    <div class="caveat"><span>Select any row to log prayers (Not yet / On time / Late) or export.</span><button type="button" class="ctx-link" data-jump="settings">Offsets</button></div>
  </div>`;
}

function renderMonthMain(loc) {

function renderQiblaMain(loc) {
  const diff = Math.round(((loc.qiblaDeg - loc.sunAz) + 540) % 360 - 180);
  const turn = diff < 0 ? `${Math.abs(diff)}° left of the Sun` : `${diff}° right of the Sun`;
  return `<div class="sheet-head"><div class="sheet-head-title"><h1>Qibla compass</h1><div class="sheet-sub">${loc.label} · ${loc.lat.toFixed(4)}°, ${loc.lon.toFixed(4)}°</div></div><div class="sheet-actions"><button type="button" class="pill-btn" data-jump="today">Back to Today</button></div></div><div class="sheet-body"><div class="qibla-stage">${compassSvg(loc.qiblaDeg, 'qibla-big-dial', true)}<div class="qibla-readout"><div class="q-stat"><small>True bearing</small><strong class="num">${loc.qiblaDeg.toFixed(1)}° ${loc.qiblaCard}</strong></div><div class="q-stat"><small>Great-circle distance</small><strong class="num">${loc.distKm}</strong></div><div class="q-stat"><small>Sun azimuth now</small><strong class="num">${loc.sunAz}° S</strong></div></div><div class="sun-cue"><svg class="ic" viewBox="0 0 24 24"><path d="M12 7a5 5 0 1 0 0 10a5 5 0 0 0 0-10ZM12 2v2M12 20v2M2 12h2M20 12h2"/></svg><div><strong>Solar alignment cue:</strong> Right now the Sun is at ${loc.sunAz}°. Face the Sun and turn <strong>${turn}</strong> to face the Kaaba without a magnetometer.</div></div></div></div>`;
}

function renderQiblaRight(loc) {
  return `<div class="sheet-head"><div class="sheet-head-title"><h1>Saved bearings</h1><div class="sheet-sub">Kaaba · 21.4225° N, 39.8262° E</div></div></div><div class="sheet-body" style="padding:10px 10px 12px"><div class="ctx-card"><div class="ctx-head"><h3>Compare locations</h3></div><div class="kv-list">${LOCATIONS.map(l=>`<div class="kv-row" style="cursor:pointer" data-loc="${l.id}"><span class="kv-k" style="${l.id===loc.id?'color:var(--accent);font-weight:620':''}">${l.label}</span><span class="kv-v num">${l.qiblaDeg.toFixed(1)}° ${l.qiblaCard}</span></div>`).join('')}</div></div><div class="ctx-card"><div class="ctx-head"><h3>Method notes</h3></div><p style="margin:0;font-size:10.3px;color:var(--muted);line-height:1.5">Computed offline using spherical great-circle bearing from true north. Compare with the live Sun azimuth cue if magnetic interference is nearby.</p></div></div>`;
}

  } else if (tab === 'offsets') {

  }
  return `${isPhone?'<div class="ph-handle"></div>':''}<div class="sheet-head" style="padding:8px 10px"><div class="sheet-head-title"><h1 style="font-size:12.8px">Prayer Times settings</h1></div>${isPhone ? `<div class="seg"><button type="button" class="${state.phoneRightMode==='log'?'active':''}" data-ph-mode="log">Log</button><button type="button" class="${state.phoneRightMode==='settings'?'active':''}" data-ph-mode="settings">Settings</button></div>` : `<button type="button" class="ib" data-jump="today"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M6 18 18 6"/></svg></button>`}</div><div class="settings-tabs">${[['location','Location'],['calculation','Calculation'],['offsets','Offsets'],['display','Display']].map(([k,lbl])=>`<button type="button" class="${tab===k?'active':''}" data-stab="${k}">${lbl}</button>`).join('')}</div><div class="set-body">${body}</div>${state.toast && !isPhone ? `<div class="set-toast"><span>${state.toast}</span><button type="button" data-undo-set>Undo</button></div>` : ''}<div class="set-foot">Changes save automatically.</div>`;
}

function renderSetupMain() {

      <div style="font-size:16px;font-weight:680;margin-bottom:2px" class="num">Asr at ${times.asr}</div>
      ${solarArcSvg(loc)}
      <div class="arc-grid">${PRAYERS.map((p,i)=>`<div class="arc-cell ${i===loc.nextIdx?'is-next':i===loc.nowIdx?'is-now':''}"><span>${p.label.slice(0,3)}</span><strong class="num" style="font-size:8.8px">${times[p.key].replace(/ [AP]M/,'')}</strong></div>`).join('')}</div>
    </div>

function wireDynamicEvents() {
  document.querySelectorAll('[data-cycle-prayer]').forEach(b => b.addEventListener('click', (e) => {
    e.stopPropagation();
    const day = parseInt(b.dataset.cycleDay, 10), k = b.dataset.cyclePrayer;
    const l = getLog(day);
    l[k] = nextStatus(l[k]);
    renderAll();
  }));
  document.querySelectorAll('[data-set-prayer]').forEach(b => b.addEventListener('click', () => {
    const day = parseInt(b.dataset.setDay, 10);
    getLog(day)[b.dataset.setPrayer] = b.dataset.setVal;
    renderAll();
  }));
  document.querySelectorAll('[data-inspect-day]').forEach(el => el.addEventListener('click', () => {
    state.selectedDay = parseInt(el.dataset.inspectDay, 10);
    state.view = 'week';
    renderAll();
  }));
  document.querySelectorAll('[data-ph-mode]').forEach(b => b.addEventListener('click', () => {
    state.phoneRightMode = b.dataset.phMode;
    renderAll();
  }));
  document.querySelectorAll('[data-jump]').forEach(b => b.addEventListener('click', () => {
    state.view = b.dataset.jump;
    if (state.view !== 'settings') state.changedCols = [];
    renderAll();
  }));
  document.querySelectorAll('[data-loc]').forEach(b => b.addEventListener('click', () => {
    state.locId = b.dataset.loc;
    state.methodOverride = null;
    state.asrOverride = null;
    state.changedCols = [];
    renderAll();
  }));
  document.querySelectorAll('[data-mmd]').forEach(b => b.addEventListener('click', () => {
    state.selectedDay = parseInt(b.dataset.mmd, 10);
    if (state.view !== 'week') state.view = 'week';
    renderAll();
  }));
  document.querySelectorAll('[data-pick-day]').forEach(tr => tr.addEventListener('click', () => {
    state.selectedDay = parseInt(tr.dataset.pickDay, 10);
    renderAll();
  }));
  document.querySelectorAll('[data-sel-today]').forEach(b => b.addEventListener('click', () => {
    state.selectedDay = 8;
    renderAll();
  }));
  document.querySelectorAll('[data-stab]').forEach(b => b.addEventListener('click', () => {
    state.settingsTab = b.dataset.stab;
    renderAll();
  }));
  document.querySelectorAll('[data-set-method]').forEach(b => b.addEventListener('click', () => {
    state.methodOverride = b.dataset.setMethod;
    state.changedCols = ['fajr', 'isha'];
    state.toast = `Method set to ${METHODS[b.dataset.setMethod].label}`;
    renderAll();
  }));
  document.querySelectorAll('[data-set-asr]').forEach(b => b.addEventListener('click', () => {
    state.asrOverride = b.dataset.setAsr;
    state.changedCols = ['asr'];
    state.toast = `Asr set to ${b.dataset.setAsr === 'hanafi' ? 'Hanafi' : 'Standard'}`;
    renderAll();
  }));
  document.querySelectorAll('[data-undo-set]').forEach(b => b.addEventListener('click', () => {
    state.methodOverride = null; state.asrOverride = null; state.fajrOffset = 0; state.changedCols = []; state.toast = 'Change undone'; renderAll();
  }));
  document.querySelectorAll('[data-off-inc]').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.offInc === 'fajr') { state.fajrOffset++; state.changedCols = ['fajr']; state.toast = `Fajr offset ${state.fajrOffset>0?'+':''}${state.fajrOffset} min`; renderAll(); }
  }));
  document.querySelectorAll('[data-off-dec]').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.offDec === 'fajr') { state.fajrOffset--; state.changedCols = ['fajr']; state.toast = `Fajr offset ${state.fajrOffset>0?'+':''}${state.fajrOffset} min`; renderAll(); }
  }));
  document.querySelectorAll('[data-reset-off]').forEach(b => b.addEventListener('click', () => {
    state.fajrOffset = 0; state.changedCols = []; state.toast = 'Offsets reset'; renderAll();
  }));
  document.querySelectorAll('[data-set-24]').forEach(b => b.addEventListener('click', () => {
    state.time24 = b.dataset.set24 === '1'; renderAll();
  }));
  document.querySelectorAll('[data-tog]').forEach(b => b.addEventListener('click', () => {
    state[b.dataset.tog] = !state[b.dataset.tog]; renderAll();
  }));
  document.querySelectorAll('[data-pick-loc], [data-start-city]').forEach(b => b.addEventListener('click', () => {
    state.locId = b.dataset.pickLoc || b.dataset.startCity;
    if (b.dataset.startCity) state.view = 'today';
    renderAll();
  }));
}

function renderAll() {
  const loc = getLoc(), times = getEffectiveTimes(loc), isPhone = state.view === 'phone';
  document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('active', b.dataset.view === state.view));
  document.querySelectorAll('[data-theme-set]').forEach(b => b.classList.toggle('active', document.getElementById('stage').dataset.theme === b.dataset.themeSet));
  document.getElementById('desktop-topbar').classList.toggle('hidden', isPhone);
  document.getElementById('desktop-ws').classList.toggle('hidden', isPhone);
  document.getElementById('phone-ws').classList.toggle('hidden', !isPhone);
  document.getElementById('stage').style.gridTemplateRows = isPhone ? 'minmax(0, 1fr)' : '44px minmax(0, 1fr)';
  document.getElementById('tb-settings').classList.toggle('on', state.view === 'settings');
  if (isPhone) { renderPhone(loc, times); wireDynamicEvents(); return; }
  renderSidebar();
  const ws = document.getElementById('desktop-ws'), main = document.getElementById('main-sheet'), right = document.getElementById('right-sheet');
  ws.className = 'workspace'; right.classList.remove('hidden');
  if (state.view === 'today') { main.innerHTML = renderTodayMain(loc, times); right.innerHTML = renderTodayRight(loc); }
  else if (state.view === 'week') { ws.className = 'workspace wide-right'; main.innerHTML = renderWeekMain(loc, times); right.innerHTML = renderDayInspector(loc, false); }
  else if (state.view === 'month') { ws.className = 'workspace no-right'; right.classList.add('hidden'); main.innerHTML = renderMonthMain(loc); }
  else if (state.view === 'qibla') { main.innerHTML = renderQiblaMain(loc); right.innerHTML = renderQiblaRight(loc); }
  else if (state.view === 'settings') { ws.className = 'workspace wide-right'; if (!state.asrOverride) { state.asrOverride = 'hanafi'; state.changedCols = ['asr']; } main.innerHTML = renderWeekMain(loc, getEffectiveTimes(loc)); right.innerHTML = renderSettingsSheet(loc, false); }
  else if (state.view === 'setup') { ws.className = 'workspace no-right'; right.classList.add('hidden'); main.innerHTML = renderSetupMain(); }
  wireDynamicEvents();
}

document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => {
  state.view = b.dataset.view;
  if (state.view !== 'settings') state.changedCols = [];
  renderAll();
}));
document.querySelectorAll('[data-nav]').forEach(b => b.addEventListener('click', () => {
  state.view = b.dataset.nav; state.changedCols = []; renderAll();
}));
document.getElementById('tb-settings').addEventListener('click', () => {
  state.view = state.view === 'settings' ? 'today' : 'settings'; renderAll();
});
document.getElementById('btn-add-loc').addEventListener('click', () => {
  state.view = 'settings'; state.settingsTab = 'location'; renderAll();
});
document.querySelectorAll('[data-theme-set]').forEach(b => b.addEventListener('click', () => {
  document.getElementById('stage').dataset.theme = b.dataset.themeSet;
  document.querySelectorAll('[data-theme-set]').forEach(x => x.classList.toggle('active', x === b));
}));

renderAll();
</script>
</body>
</html>
