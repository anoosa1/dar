[package]
name = "dar-bindings"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "SpacetimeDB client bindings for Dar's module, shared by the client and the acceptance suite"

# The browser transport is for wasm32 only; native builds (unit tests, the acceptance suite)
# use the default one.
[target.'cfg(target_arch = "wasm32")'.dependencies]
spacetimedb-sdk = { workspace = true, features = ["browser"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
spacetimedb-sdk.workspace = true
