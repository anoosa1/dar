[package]
name = "dar-module"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Dar's SpacetimeDB module: tables, views, reducers and procedures"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
spacetimedb.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
unicode-normalization = "0.1"

[dev-dependencies]
spacetimedb = { workspace = true, features = ["test-utils"] }

