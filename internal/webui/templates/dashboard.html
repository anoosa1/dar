{{define "dashboard.html"}}
<div id="dashboard-scroll" class="h-full min-h-0 overflow-y-auto overscroll-contain p-4 [scrollbar-gutter:stable] md:p-8">
  <section class="dashboard-composition mx-auto max-w-[1440px] p-5 md:p-7" aria-labelledby="dashboard-title">
    <header class="mb-7 flex items-end gap-4">
      <div class="min-w-0 flex-1"><p class="mb-1 text-xs font-semibold uppercase tracking-widest text-primary">Today</p><h1 id="dashboard-title" class="text-3xl font-normal tracking-tight">Your day at a glance</h1><p class="mt-2 text-sm text-on-surface-variant">Calendar, tasks, files, and updates from across Dar.</p></div>
      <button id="dashboard-edit" type="button" class="h-10 rounded-xl border border-outline-variant bg-surface-container-low px-4 text-sm hover:bg-surface-container" aria-label="Edit dashboard" aria-pressed="false"><i class="fa-solid fa-pen mr-2"></i>Edit</button>
    </header>
    <div id="dashboard-catalog" class="hidden mb-5 rounded-2xl border border-outline-variant bg-surface-container-low p-3" aria-label="Available widgets"></div>
    <p id="dashboard-status" class="sr-only" aria-live="polite"></p>
    <div id="dashboard-grid" class="grid grid-cols-1 auto-rows-auto gap-4 md:grid-cols-12 md:auto-rows-[72px]"></div>
    <div id="dashboard-settings-modal" class="hidden fixed inset-0 z-[80] items-center justify-center bg-scrim/50 p-4" role="dialog" aria-modal="true" aria-labelledby="dashboard-settings-title">
      <form id="dashboard-settings-form" class="max-h-[90vh] w-full max-w-md overflow-y-auto rounded-2xl border border-outline-variant bg-surface p-5 shadow-2xl">
        <header class="mb-5 flex items-center gap-3"><h2 id="dashboard-settings-title" class="flex-1 text-xl font-semibold">Widget settings</h2><button id="dashboard-settings-close" type="button" class="h-10 w-10 rounded-full hover:bg-surface-container" aria-label="Close settings"><i class="fa-solid fa-xmark"></i></button></header>
        <fieldset id="dashboard-settings-sizes"><legend class="mb-2 text-sm font-semibold">Size</legend><div id="dashboard-settings-size-options" class="grid grid-cols-2 gap-2"></div></fieldset>
        <div id="dashboard-settings-provider" class="mt-5 hidden"><h3 class="mb-3 text-sm font-semibold">Content</h3><div id="dashboard-settings-fields" class="space-y-4"></div></div>
        <p id="dashboard-settings-message" class="mt-3 hidden text-sm" aria-live="polite"></p>
        <footer class="mt-5 flex justify-end gap-2"><button type="button" id="dashboard-settings-cancel" class="h-10 rounded-xl px-4 hover:bg-surface-container">Cancel</button><button type="submit" class="h-10 rounded-xl bg-primary px-5 font-medium text-on-primary">Save</button></footer>
      </form>
    </div>
  </section>
</div>
<script src="/assets/dashboard.js?v=2" defer></script>
{{end}}
