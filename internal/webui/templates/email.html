{{define "email.html"}}
<section id="email-app" data-disabled="{{.DisabledReason}}" data-dar-shell class="flex h-full min-h-0 overflow-hidden bg-surface">
  <aside id="email-sidebar" data-dar-sidebar data-dar-sidebar-key="email" aria-label="Email navigation" class="flex w-[280px] shrink-0 flex-col border-r border-outline-variant bg-surface-container-low">
    <div class="p-3">
      <button id="compose-button" type="button" class="flex h-14 w-full items-center justify-center gap-3 rounded-2xl bg-primary-container px-5 font-medium text-primary hover:shadow-1"><i class="fa-solid fa-pen"></i>Compose</button>
    </div>
    <nav id="mailbox-tree" class="min-h-0 flex-1 overflow-y-auto px-2 pb-3" aria-label="Mailboxes"></nav>
    <div class="border-t border-outline-variant p-2">
      <button id="sync-button" type="button" class="flex h-10 w-full items-center gap-3 rounded-full px-4 text-sm hover:bg-surface-container-high"><i class="fa-solid fa-rotate"></i><span>Sync all</span></button>
      <button id="settings-button" type="button" class="flex h-10 w-full items-center gap-3 rounded-full px-4 text-sm hover:bg-surface-container-high"><i class="fa-solid fa-gear"></i><span>Email settings</span></button>
    </div>
  </aside>

  <section id="thread-panel" data-dar-master-pane class="flex min-w-0 flex-1 flex-col border-r border-outline-variant bg-transparent lg:max-w-md">
    <header data-dar-sidebar-toggle-host class="flex h-14 shrink-0 items-center gap-2 border-b border-outline-variant px-3">
      <h1 class="min-w-0 flex-1 truncate text-lg font-semibold">Email</h1>
    </header>
    <header class="flex h-16 shrink-0 items-center gap-2 border-b border-outline-variant bg-transparent px-3">
      <div class="relative min-w-0 flex-1"><i class="fa-solid fa-magnifying-glass absolute left-4 top-3 text-sm text-on-surface-variant"></i><input id="email-search" type="search" placeholder="Search mail" class="h-10 w-full rounded-full border-0 bg-surface-container pl-10 pr-4 text-sm outline-none focus:ring-2 focus:ring-primary/30"></div>
      <button id="mobile-compose" type="button" class="h-10 w-10 rounded-full bg-primary text-on-primary lg:hidden" aria-label="Compose"><i class="fa-solid fa-pen"></i></button>
    </header>
    <div id="bulk-toolbar" class="hidden h-12 shrink-0 items-center gap-1 border-b border-outline-variant bg-primary-container px-2">
      <span id="selection-count" class="mr-auto px-2 text-sm font-medium"></span>
      <button data-bulk="read" class="h-9 w-9 rounded-full hover:bg-surface" aria-label="Mark selected read"><i class="fa-regular fa-envelope-open"></i></button>
      <button data-bulk="flag" class="h-9 w-9 rounded-full hover:bg-surface" aria-label="Flag selected"><i class="fa-regular fa-star"></i></button>
      <button data-bulk="archive" class="h-9 w-9 rounded-full hover:bg-surface" aria-label="Archive selected"><i class="fa-solid fa-box-archive"></i></button>
      <button data-bulk="trash" class="h-9 w-9 rounded-full hover:bg-surface" aria-label="Move selected to Trash"><i class="fa-regular fa-trash-can"></i></button>
    </div>
    <div id="sync-state" class="hidden border-b border-outline-variant px-4 py-2 text-xs text-on-surface-variant" role="status" aria-live="polite"></div>
    <div id="thread-list" class="min-h-0 flex-1 overflow-y-auto" aria-live="polite"></div>
    <button id="load-more" type="button" class="hidden h-11 shrink-0 border-t border-outline-variant text-sm text-primary hover:bg-surface-container-low">Load more</button>
  </section>

  <section id="reader-panel" class="hidden min-h-0 min-w-0 flex-[1.5] flex-col bg-transparent lg:flex" data-dar-detail-pane aria-label="Message reader">
    <div id="reader-empty" class="m-auto max-w-sm p-8 text-center text-on-surface-variant"><i class="fa-regular fa-envelope-open mb-4 block text-5xl"></i><p class="text-lg font-medium text-on-surface">Choose a conversation</p><p class="mt-2 text-sm">Messages stay on this server for fast, private access.</p></div>
    <article id="reader" class="hidden min-h-0 flex-1 flex-col overflow-hidden"></article>
  </section>
</section>

<div id="disabled-banner" class="hidden fixed inset-x-4 top-20 z-40 mx-auto max-w-2xl rounded-2xl border border-error bg-error-container p-5 text-error shadow-2"><div class="flex gap-3"><i class="fa-solid fa-triangle-exclamation mt-1"></i><div><h2 class="font-semibold">Email is unavailable</h2><p id="disabled-message" class="mt-1 text-sm"></p><p class="mt-2 text-xs">Configure DAR_EMAIL_ENCRYPTION_KEYS and ensure mbsync is installed, then restart Dar.</p></div></div></div>

<div id="modal-backdrop" class="hidden fixed inset-0 z-50 items-center justify-center bg-scrim/40 p-0 sm:p-3" role="presentation">
  <section id="modal" class="h-full max-h-none w-full max-w-2xl overflow-y-auto rounded-none bg-surface p-4 shadow-2 sm:h-auto sm:max-h-[94vh] sm:rounded-3xl sm:p-5" role="dialog" aria-modal="true"></section>
</div>
<div id="toast" class="hidden fixed bottom-5 left-1/2 z-[60] -translate-x-1/2 rounded-full bg-on-surface px-5 py-3 text-sm text-surface shadow-2" role="status"></div>
<script src="/email/assets/app.js"></script>
{{end}}
