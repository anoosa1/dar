{{define "notes.html"}}
<div id="notes-app" data-user-id="{{.UserID}}" data-dar-shell class="flex h-full min-h-0 overflow-hidden bg-surface">
  <aside id="notes-categories" data-dar-sidebar data-dar-sidebar-key="notes" aria-label="Notes navigation" class="flex w-[280px] shrink-0 flex-col border-r border-outline-variant bg-surface-container-low">
    <div class="h-14 shrink-0 px-3 flex items-center gap-2 border-b border-outline-variant"><button id="new-note" type="button" class="h-10 px-4 rounded-full bg-primary text-on-primary text-sm font-medium flex items-center gap-2"><i class="fa-solid fa-plus"></i><span>New note</span></button><span class="flex-1"></span><button id="new-category" type="button" class="w-10 h-10 rounded-full hover:bg-surface-container-highest" title="New category"><i class="fa-solid fa-folder-plus"></i></button></div>
    <nav id="category-list" class="p-2 overflow-y-auto flex-1"></nav>
    <button id="notes-settings" type="button" class="h-12 px-4 border-t border-outline-variant flex items-center gap-3 text-sm text-on-surface-variant hover:bg-surface-container-low"><i class="fa-solid fa-gear w-5"></i><span>Settings</span></button>
  </aside>

  <section id="notes-list-pane" data-dar-master-pane class="flex w-full shrink-0 flex-col border-r border-outline-variant bg-transparent lg:w-96">
    <header data-dar-sidebar-toggle-host class="flex h-14 shrink-0 items-center gap-2 border-b border-outline-variant px-3"><h1 class="min-w-0 flex-1 truncate text-lg font-semibold">Notes</h1></header>
    <div class="h-14 px-3 flex items-center gap-2 border-b border-outline-variant bg-transparent"><div class="relative flex-1"><i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-sm text-on-surface-variant"></i><input id="note-search" type="search" placeholder="Search notes" class="w-full h-10 pl-9 pr-3 rounded-full bg-surface-container border-0 outline-none focus:ring-2 focus:ring-primary/30 text-sm"></div></div>
    <div id="note-list" class="overflow-y-auto flex-1"></div>
    <button id="more-notes" type="button" class="hidden h-10 text-sm text-primary border-t border-outline-variant hover:bg-primary-container">Show more</button>
  </section>

  <section id="notes-editor-pane" data-dar-detail-pane class="hidden min-h-0 min-w-0 flex-1 flex-col bg-transparent p-0 lg:flex" aria-label="Note editor">
    <div id="empty-editor" class="flex-1 flex items-center justify-center text-on-surface-variant"><div class="text-center"><i class="fa-regular fa-note-sticky text-4xl block mb-3"></i><p>Select a note</p></div></div>
    <div id="editor-shell" class="hidden flex-1 min-h-0 flex-col">
      <header class="h-14 px-2 md:px-3 flex items-center gap-1 border-b border-outline-variant shrink-0">
        <button id="notes-back" data-dar-detail-back type="button" class="lg:hidden w-10 h-10 rounded-full hover:bg-surface-container-highest" title="Notes"><i class="fa-solid fa-chevron-left"></i></button>
        <button id="favorite-note" type="button" class="w-10 h-10 rounded-full hover:bg-surface-container-highest" title="Favorite"><i class="fa-regular fa-star"></i></button>
        <input id="note-title" aria-label="Note title" class="min-w-0 flex-1 h-10 bg-transparent border-0 outline-none font-semibold text-base px-2" placeholder="New note">
        <span id="save-status" class="hidden sm:inline text-xs text-on-surface-variant whitespace-nowrap"></span>
        <button id="insert-image" type="button" class="hidden sm:inline-flex w-10 h-10 rounded-full hover:bg-surface-container-highest items-center justify-center" title="Insert image"><i class="fa-regular fa-image"></i></button><input id="image-input" type="file" accept="image/png,image/jpeg,image/gif,image/webp" class="hidden">
        <button id="note-versions" type="button" class="hidden sm:inline-flex w-10 h-10 rounded-full hover:bg-surface-container-highest items-center justify-center" title="Version history"><i class="fa-solid fa-clock-rotate-left"></i></button>
        <button id="fullscreen-note" type="button" class="hidden sm:inline-flex w-10 h-10 rounded-full hover:bg-surface-container-highest items-center justify-center" title="Full screen"><i class="fa-solid fa-expand"></i></button>
        <button id="delete-note" type="button" class="hidden sm:inline-flex w-10 h-10 rounded-full hover:bg-error-container text-error items-center justify-center" title="Delete"><i class="fa-regular fa-trash-can"></i></button>
        <div class="relative sm:hidden"><button id="mobile-note-actions" type="button" onclick="document.getElementById('mobile-actions-menu').classList.toggle('hidden')" class="w-10 h-10 rounded-full hover:bg-surface-container-highest" title="Note actions"><i class="fa-solid fa-ellipsis-vertical"></i></button><div id="mobile-actions-menu" class="hidden absolute right-0 top-11 z-30 w-48 bg-surface border border-outline-variant rounded-md shadow-2 p-1"><button onclick="document.getElementById('mobile-actions-menu').classList.add('hidden');document.getElementById('image-input').click()" class="w-full h-10 px-3 rounded-md text-left text-sm hover:bg-surface-container-high"><i class="fa-regular fa-image w-6"></i>Insert image</button><button onclick="document.getElementById('mobile-actions-menu').classList.add('hidden');document.getElementById('note-versions').click()" class="w-full h-10 px-3 rounded-md text-left text-sm hover:bg-surface-container-high"><i class="fa-solid fa-clock-rotate-left w-6"></i>Version history</button><button onclick="document.getElementById('mobile-actions-menu').classList.add('hidden');document.getElementById('fullscreen-note').click()" class="w-full h-10 px-3 rounded-md text-left text-sm hover:bg-surface-container-high"><i class="fa-solid fa-expand w-6"></i>Full screen</button><button onclick="document.getElementById('mobile-actions-menu').classList.add('hidden');document.getElementById('delete-note').click()" class="w-full h-10 px-3 rounded-md text-left text-sm hover:bg-error-container text-error"><i class="fa-regular fa-trash-can w-6"></i>Delete</button></div></div>
      </header>
      <div class="h-12 px-3 flex items-center gap-2 border-b border-outline-variant shrink-0 overflow-x-auto">
        <select id="note-category" aria-label="Category" class="h-9 w-36 sm:w-auto sm:max-w-48 px-3 rounded-full bg-surface-container border-0 text-sm"></select>
        <span class="flex-1"></span>
        <div id="editor-mode" class="flex rounded-full bg-surface-container p-1 shrink-0"><button data-editor-mode="rich" class="h-8 px-2 sm:px-3 rounded-full text-xs">Rich</button><button data-editor-mode="source" class="h-8 px-2 sm:px-3 rounded-full text-xs">Source</button><button data-editor-mode="preview" class="h-8 px-2 sm:px-3 rounded-full text-xs">Preview</button></div>
      </div>
      <div id="format-toolbar" class="h-11 px-3 flex items-center gap-1 border-b border-outline-variant shrink-0 overflow-hidden">
        <button data-editor-format="bold" class="w-9 h-9 rounded-full hover:bg-surface-container-highest font-bold" title="Bold">B</button><button data-editor-format="italic" class="w-9 h-9 rounded-full hover:bg-surface-container-highest italic" title="Italic">I</button><button data-editor-format="h2" class="w-9 h-9 rounded-full hover:bg-surface-container-highest" title="Heading">H</button><button data-editor-format="link" class="w-9 h-9 rounded-full hover:bg-surface-container-highest" title="Link"><i class="fa-solid fa-link"></i></button><button data-editor-format="ul" class="w-9 h-9 rounded-full hover:bg-surface-container-highest" title="Bulleted list"><i class="fa-solid fa-list-ul"></i></button><button data-editor-format="task" class="w-9 h-9 rounded-full hover:bg-surface-container-highest" title="Task list"><i class="fa-solid fa-list-check"></i></button><button data-editor-format="quote" class="w-9 h-9 rounded-full hover:bg-surface-container-highest" title="Quote"><i class="fa-solid fa-quote-left"></i></button><button data-editor-format="code" class="w-9 h-9 rounded-full hover:bg-surface-container-highest" title="Code"><i class="fa-solid fa-code"></i></button>
      </div>
      <div class="flex-1 min-h-0 overflow-y-auto"><div id="rich-editor" contenteditable="true" class="min-h-full max-w-4xl mx-auto px-5 md:px-10 py-8 outline-none text-[15px] leading-7"></div><textarea id="source-editor" spellcheck="false" class="hidden w-full min-h-full resize-none border-0 outline-none bg-transparent px-5 md:px-10 py-8 font-mono text-sm leading-6"></textarea><article id="preview-editor" class="hidden max-w-4xl mx-auto px-5 md:px-10 py-8 text-[15px] leading-7"></article></div>
    </div>
  </section>
</div>

<div id="notes-dialog" class="hidden fixed inset-0 z-50 bg-scrim/30 p-4 items-center justify-center"><div class="bg-surface border border-outline-variant rounded-md shadow-2 w-full max-w-lg max-h-[80vh] flex flex-col"><header class="h-14 px-4 flex items-center border-b border-outline-variant"><h2 id="dialog-title" class="font-semibold flex-1"></h2><button id="dialog-close" class="w-9 h-9 rounded-full hover:bg-surface-container-highest" title="Close"><i class="fa-solid fa-xmark"></i></button></header><div id="dialog-body" class="p-4 overflow-y-auto"></div></div></div>
<div id="notes-toast" class="hidden fixed left-1/2 bottom-5 -translate-x-1/2 z-50 bg-on-surface text-surface rounded-md px-4 py-3 text-sm shadow-2 items-center gap-3"><span id="toast-text"></span><button id="toast-action" class="text-primary-container font-semibold"></button></div>
<script src="/assets/text-editor.js"></script>
<script src="/notes/assets/app.js"></script>
{{end}}
