{{define "news.html"}}
<div id="news-app" data-view="{{.View}}" data-dar-shell class="h-full min-h-0 overflow-hidden bg-surface">
  <div class="h-full min-h-0 grid grid-cols-1 grid-rows-[minmax(0,1fr)] lg:grid-cols-[auto_360px_minmax(0,1fr)]" id="news-grid">
    <aside id="news-nav" data-dar-sidebar data-dar-sidebar-key="news" aria-label="News navigation" class="flex h-full min-h-0 bg-surface-container-low border-r border-outline-variant flex-col overflow-hidden">
      <div class="p-3 grid grid-cols-2 gap-2">
        <button id="subscribe-button" type="button" onclick="openSubscribe()" class="col-span-2 h-10 rounded-full bg-primary text-on-primary text-sm font-medium"><i class="fa-solid fa-plus mr-2"></i>Subscribe</button>
        <button type="button" onclick="openFolder()" class="h-10 rounded-full bg-surface-container-high text-sm"><i class="fa-solid fa-folder-plus mr-2"></i>Folder</button>
        <button id="refresh-button" type="button" onclick="refreshAll()" class="h-10 rounded-full bg-surface-container-high text-sm"><i class="fa-solid fa-rotate mr-2"></i>Refresh</button>
      </div>
      <nav class="px-2 space-y-1" aria-label="News views">
        <button data-view="unread" onclick="selectView('unread')" class="news-nav-item w-full h-10 px-3 rounded-full text-left text-sm flex items-center gap-3"><i class="fa-regular fa-eye w-5 text-center"></i><span class="flex-1">Unread articles</span><span id="all-unread" class="text-xs"></span></button>
        <button data-view="all" onclick="selectView('all')" class="news-nav-item w-full h-10 px-3 rounded-full text-left text-sm flex items-center gap-3"><i class="fa-solid fa-rss w-5 text-center"></i><span>All articles</span></button>
        <button data-view="recent" onclick="selectView('recent')" class="news-nav-item w-full h-10 px-3 rounded-full text-left text-sm flex items-center gap-3"><i class="fa-solid fa-clock-rotate-left w-5 text-center"></i><span>Recently viewed</span></button>
        <button data-view="starred" onclick="selectView('starred')" class="news-nav-item w-full h-10 px-3 rounded-full text-left text-sm flex items-center gap-3"><i class="fa-solid fa-star w-5 text-center text-warning"></i><span>Starred</span></button>
      </nav>
      <div class="px-4 pt-5 pb-2 flex items-center justify-between"><h2 class="text-xs font-semibold uppercase tracking-wider text-on-surface-variant">Feeds</h2><button onclick="openFeedSettings()" aria-label="Feed settings" title="Feed settings" class="w-8 h-8 rounded-full hover:bg-surface-container-high"><i class="fa-solid fa-sliders"></i></button></div>
      <div id="feed-tree" class="flex-1 overflow-y-auto px-2 pb-3"></div>
      <div class="p-2 border-t border-outline-variant space-y-1">
        <button onclick="showExplore()" class="w-full h-10 px-3 rounded-full text-left text-sm hover:bg-surface-container-high"><i class="fa-solid fa-globe w-6"></i>Explore</button>
        <button id="news-settings-button" onclick="openSettings()" class="w-full h-10 px-3 rounded-full text-left text-sm hover:bg-surface-container-high"><i class="fa-solid fa-gear w-6"></i>News settings</button>
      </div>
    </aside>

    <section id="article-list-pane" data-dar-master-pane class="h-full min-h-0 bg-transparent border-r border-outline-variant flex flex-col min-w-0">
      <header data-dar-sidebar-toggle-host class="h-14 px-4 border-b border-outline-variant flex items-center gap-2 shrink-0">
        <h1 id="view-title" class="font-medium flex-1 truncate">Unread articles</h1>
        <button onclick="markCurrentRead()" class="w-10 h-10 rounded-full hover:bg-surface-container-high" title="Mark current view read" aria-label="Mark current view read"><i class="fa-solid fa-check-double"></i></button>
      </header>
      <div id="article-list" role="list" aria-label="Article list" class="flex-1 overflow-y-auto"></div>
    </section>

    <article id="article-detail" data-dar-detail-pane class="hidden h-full min-h-0 min-w-0 bg-transparent flex-col overflow-hidden lg:flex">
      <div id="empty-detail" class="m-auto text-center text-on-surface-variant p-8"><i class="fa-regular fa-newspaper text-5xl mb-4"></i><h2 class="text-xl font-medium text-on-surface">No article selected</h2><p class="mt-2">Select an article from the list.</p></div>
      <div id="selected-detail" class="hidden h-full flex-col">
        <header class="p-4 border-b border-outline-variant flex items-start gap-3">
          <button data-dar-detail-back onclick="closeDetail()" class="lg:hidden w-10 h-10 rounded-full hover:bg-surface-container-high" aria-label="Back to articles"><i class="fa-solid fa-arrow-left"></i></button>
          <div class="flex-1 min-w-0"><h2 id="detail-title" class="text-xl font-semibold"></h2><p id="detail-meta" class="text-sm text-on-surface-variant mt-1"></p></div>
          <button id="detail-star" onclick="toggleSelectedStar()" class="w-10 h-10 rounded-full hover:bg-surface-container-high" aria-label="Toggle starred"><i class="fa-regular fa-star"></i></button>
          <a id="detail-open" target="_blank" rel="noopener noreferrer" class="h-10 px-3 rounded-full hover:bg-surface-container-high inline-flex shrink-0 items-center justify-center gap-2 whitespace-nowrap text-on-surface" aria-label="Open original"><i class="fa-solid fa-arrow-up-right-from-square"></i><span id="detail-open-label" class="hidden xl:inline">Open original</span></a>
        </header>
        <iframe id="detail-body" sandbox="" referrerpolicy="no-referrer" title="Article content" class="flex-1 w-full border-0 bg-surface"></iframe>
      </div>
    </article>
  </div>

  <div id="modal-backdrop" class="hidden fixed inset-0 z-40 bg-scrim/40 items-center justify-center p-4" onclick="if(event.target===this)closeModal()">
    <section id="modal" role="dialog" aria-modal="true" class="bg-surface rounded-3xl shadow-2xl w-full max-w-xl max-h-[90vh] overflow-y-auto p-6"></section>
  </div>
  <input id="import-file" type="file" class="hidden">
  <div id="toast" role="status" class="hidden fixed bottom-5 left-1/2 -translate-x-1/2 z-50 rounded-full bg-on-surface text-surface px-5 py-3 text-sm shadow-2xl"></div>
</div>

<script>
const V13='/index.php/apps/news/api/v1-3', AUX='/news/api';
const defaultPrefs={disableScrollRead:false,showAll:false,oldestFirst:false,disableAutoRefresh:false,thumbnails:'always',enclosures:'always',images:'ask',iframes:'ask',displayMode:'default',splitMode:'vertical'};
let feeds=[], folders=[], articles=[], selected=null, view=document.getElementById('news-app')?.dataset.view||'unread', viewID=0, prefs={...defaultPrefs};
const $=id=>document.getElementById(id), esc=s=>{const d=document.createElement('div');d.textContent=s??'';return d.innerHTML};
async function request(url,options={}){const r=await fetch(url,options);if(!r.ok){let m='Request failed';try{m=(await r.json()).error||m}catch{}throw new Error(m)}if(r.status===204||r.headers.get('content-length')==='0')return null;return r.json()}
function toast(message,error=false){const t=$('toast');t.textContent=message;t.className='fixed bottom-5 left-1/2 -translate-x-1/2 z-50 rounded-full px-5 py-3 text-sm shadow-2xl '+(error?'bg-error text-on-primary':'bg-on-surface text-surface');setTimeout(()=>t.classList.add('hidden'),3500)}
function activateNav(){document.querySelectorAll('.news-nav-item').forEach(x=>x.classList.toggle('bg-primary-container',x.dataset.view===view));}
function titleForView(){if(view==='feed')return feeds.find(f=>f.id===viewID)?.title||'Feed';if(view==='folder')return folders.find(f=>f.id===viewID)?.name||'Folder';return {unread:'Unread articles',all:'All articles',recent:'Recently viewed',starred:'Starred'}[view]||'News'}
function targetArticleID(){const target=location.hash.match(/^#article-(\d+)$/);return target?Number(target[1]):0}
async function init(){try{const loaded=await Promise.all([request(V13+'/folders').then(x=>x.folders||[]),request(V13+'/feeds').then(x=>x.feeds||[]),request(AUX+'/preferences')]);folders=loaded[0];feeds=loaded[1];prefs={...defaultPrefs,...loaded[2]};const targetID=targetArticleID();if(targetID){view='all';if(DarUI.shell.isCompact())history.replaceState({darDetail:'news',darDirect:'news'},'',location.href)}applyLayout();renderTree();activateNav();await loadArticles(targetID);if(targetID)await openArticle(targetID);if(!prefs.disableAutoRefresh)setInterval(reloadData,60000)}catch(e){toast(e.message,true)}}
function applyLayout(){const g=$('news-grid'),nav=$('news-nav'),list=$('article-list-pane'),detail=$('article-detail');nav.classList.remove('lg:row-span-2');list.classList.remove('lg:col-start-2');detail.classList.remove('lg:col-start-2');if(prefs?.splitMode==='horizontal'){g.className='h-full min-h-0 grid grid-cols-1 grid-rows-[minmax(0,1fr)] lg:grid-cols-[auto_minmax(0,1fr)] lg:grid-rows-[minmax(0,1fr)_minmax(0,1fr)]';nav.classList.add('lg:row-span-2');list.classList.add('lg:col-start-2');detail.classList.add('lg:col-start-2')}else{g.className='h-full min-h-0 grid grid-cols-1 grid-rows-[minmax(0,1fr)] lg:grid-cols-[auto_360px_minmax(0,1fr)]'}}
function renderTree(){const total=feeds.reduce((n,f)=>n+(f.unreadCount||0),0);$('all-unread').textContent=total||'';const root=feeds.filter(f=>!f.folderId);let html=root.map(feedRow).join('');for(const folder of folders){const children=feeds.filter(f=>f.folderId===folder.id);html+=`<div class="mt-2"><button onclick="selectFolder(${folder.id})" class="w-full h-9 px-3 rounded-full text-left text-sm font-medium hover:bg-surface-container-high"><i class="fa-solid fa-folder w-6 text-primary"></i>${esc(folder.name)} <span class="float-right text-xs">${children.reduce((n,f)=>n+(f.unreadCount||0),0)||''}</span></button><div class="pl-3">${children.map(feedRow).join('')}</div></div>`}$('feed-tree').innerHTML=html||'<p class="px-3 py-4 text-sm text-on-surface-variant">Subscribe to a feed to get started.</p>';$('feed-tree').querySelectorAll('[data-feed-error]').forEach(node=>{const feed=feeds.find(f=>f.id===Number(node.dataset.feedError));node.title=feed?.lastUpdateError||''})}
function feedRow(f){return `<div class="group flex items-center rounded-full hover:bg-surface-container-high"><button onclick="selectFeed(${f.id})" class="flex-1 min-w-0 h-9 pl-3 text-left text-sm truncate"><i class="fa-solid fa-rss w-6"></i>${esc(f.title)}${f.updateErrorCount>=8?` <span data-feed-error="${f.id}" class="text-error">●</span>`:''}</button><span class="text-xs">${f.unreadCount||''}</span><button onclick="editFeed(${f.id})" class="w-8 h-8 rounded-full opacity-0 group-hover:opacity-100 focus:opacity-100" aria-label="Feed options"><i class="fa-solid fa-ellipsis"></i></button></div>`}
function selectView(v){view=v;viewID=0;activateNav();loadArticles();closeMobileNav()}
function selectFeed(id){view='feed';viewID=id;activateNav();loadArticles();closeMobileNav()}
function selectFolder(id){view='folder';viewID=id;activateNav();loadArticles();closeMobileNav()}
async function loadArticles(targetID=0){selected=null;showEmpty();$('view-title').textContent=titleForView();$('article-list').innerHTML='<div class="p-8 text-center text-on-surface-variant"><i class="fa-solid fa-spinner fa-spin"></i> Loading</div>';try{let url;if(view==='recent')url=AUX+'/recent';else{const getRead=view==='all'||view==='starred'||!!prefs?.showAll;let p=new URLSearchParams({type:view==='feed'?'0':view==='folder'?'1':view==='starred'?'2':'3',id:viewID,getRead:String(getRead),batchSize:'100',oldestFirst:String(!!prefs?.oldestFirst)});if(targetID)p.set('offset',String(targetID));url=V13+'/items?'+p}articles=(await request(url)).items||[];renderArticles()}catch(e){$('article-list').innerHTML='<div class="p-8 text-center text-error">'+esc(e.message)+'</div>'}}
function renderArticles(){const list=$('article-list');if(!articles.length){list.innerHTML='<div class="p-10 text-center text-on-surface-variant"><i class="fa-regular fa-circle-check text-4xl mb-3"></i><p>No articles here</p></div>';return}list.className='flex-1 overflow-y-auto '+(prefs?.displayMode==='compact'?'text-sm':'');list.innerHTML=articles.map(a=>`<button role="listitem" data-id="${a.id}" onclick="openArticle(${a.id})" class="w-full text-left border-b border-outline-variant px-4 ${prefs?.displayMode==='compact'?'py-2':'py-3'} hover:bg-surface-container-high ${a.unread?'bg-primary-container/30':''}"><div class="flex gap-2"><span class="flex-1 font-medium line-clamp-2">${esc(a.title||'Untitled')}</span>${a.starred?'<i class="fa-solid fa-star text-warning"></i>':''}</div><p class="text-xs text-on-surface-variant mt-1">${new Date(a.pubDate*1000).toLocaleString()}</p>${prefs?.displayMode==='default'?`<p class="text-sm text-on-surface-variant line-clamp-2 mt-1">${esc(strip(a.body).slice(0,240))}</p>`:''}</button>`).join('');installScrollRead()}
function installScrollRead(){const list=$('article-list');list.onscroll=null;if(prefs?.disableScrollRead)return;list.onscroll=()=>{const boundary=list.getBoundingClientRect().bottom;document.querySelectorAll('#article-list [data-id]').forEach(node=>{if(node.getBoundingClientRect().bottom<=boundary){const a=articles.find(x=>x.id===Number(node.dataset.id));if(a?.unread){a.unread=false;request(V13+'/items/'+a.id+'/read',{method:'POST'}).catch(()=>{})}}})}}
function strip(s){return String(s||'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim()}
async function openArticle(id){selected=articles.find(a=>a.id===id);if(!selected)return;selected.unread=false;renderArticles();$('empty-detail').classList.add('hidden');$('selected-detail').classList.remove('hidden');$('selected-detail').classList.add('flex');$('detail-title').textContent=selected.title||'Untitled';$('detail-meta').textContent=new Date(selected.pubDate*1000).toLocaleString();const youtube=isYouTubeURL(selected.url),openLabel=youtube?'Watch on YouTube':'Open original';$('detail-open').href=safeURL(selected.url)?selected.url:'#';$('detail-open').setAttribute('aria-label',openLabel);$('detail-open-label').textContent=openLabel;$('detail-star').innerHTML=selected.starred?'<i class="fa-solid fa-star text-warning"></i>':'<i class="fa-regular fa-star"></i>';const mediaParams=new URLSearchParams();if(prefs?.images==='always')mediaParams.set('images','1');if(prefs?.enclosures==='always')mediaParams.set('enclosures','1');const mediaQuery=mediaParams.toString();$('detail-body').src=AUX+'/content/'+encodeURIComponent(id)+(mediaQuery?'?'+mediaQuery:'');if(DarUI.shell.isCompact()){if(history.state?.darDetail==='news')history.replaceState({...history.state,darDetail:'news'},'','#article-'+id);else history.pushState({darDetail:'news'},'','#article-'+id)}DarUI.shell.openDetail($('article-detail'),{master:$('article-list-pane'),returnFocus:document.querySelector(`[data-id="${id}"]`)});await request(AUX+'/items/'+id+'/view',{method:'POST'}).catch(()=>{})}
function safeURL(raw){if(typeof raw!=='string'||!raw.trim())return false;try{const u=new URL(raw,location.href);return u.protocol==='http:'||u.protocol==='https:'}catch{return false}}
function isYouTubeURL(raw){if(!safeURL(raw))return false;const host=new URL(raw,location.href).hostname.toLowerCase();return ['youtube.com','www.youtube.com','m.youtube.com','youtu.be','www.youtu.be'].includes(host)}
function showEmpty(){$('empty-detail').classList.remove('hidden');$('selected-detail').classList.add('hidden');$('selected-detail').classList.remove('flex')}
function closeDetail(fromHistory=false){if(DarUI.shell.isCompact()&&!fromHistory&&history.state?.darDirect==='news'){history.replaceState({},'',location.pathname+location.search)}else if(DarUI.shell.isCompact()&&!fromHistory&&history.state?.darDetail==='news'){history.back();return}selected=null;DarUI.shell.closeDetail($('article-detail'),{master:$('article-list-pane')})}
async function toggleSelectedStar(){if(!selected)return;await request(V13+'/items/'+selected.id+'/'+(selected.starred?'unstar':'star'),{method:'POST'});selected.starred=!selected.starred;openArticle(selected.id)}
async function markCurrentRead(){let url=V13+'/items/read';if(view==='feed')url=V13+'/feeds/'+viewID+'/read';if(view==='folder')url=V13+'/folders/'+viewID+'/read';await request(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({newestItemId:Math.max(0,...articles.map(x=>x.id))})});toast('Articles marked read');await reloadData()}
async function refreshAll(){const b=$('refresh-button');b.disabled=true;b.innerHTML='<i class="fa-solid fa-spinner fa-spin mr-2"></i>Refreshing';await request(AUX+'/refresh',{method:'POST'});const poll=setInterval(async()=>{const s=await request(AUX+'/refresh');if(!s.running){clearInterval(poll);b.disabled=false;b.innerHTML='<i class="fa-solid fa-rotate mr-2"></i>Refresh';toast('Feeds refreshed');reloadData()}},700)}
async function reloadData(){[folders,feeds]=await Promise.all([request(V13+'/folders').then(x=>x.folders||[]),request(V13+'/feeds').then(x=>x.feeds||[])]);renderTree();loadArticles()}
function showModal(html){$('modal').innerHTML=html;$('modal-backdrop').classList.remove('hidden');$('modal-backdrop').classList.add('flex')}
function closeModal(){$('modal-backdrop').classList.add('hidden');$('modal-backdrop').classList.remove('flex')}
function openSubscribe(){showModal(`<h2 class="text-xl font-semibold mb-5">Subscribe to a feed</h2><form onsubmit="subscribe(event)" class="space-y-4"><label class="block text-sm font-medium">Web address<input id="sub-url" required type="url" placeholder="https://example.com/feed.xml" class="mt-1 w-full h-12 px-4 rounded-full bg-surface-container border-0"></label><label class="block text-sm font-medium">Folder<select id="sub-folder" class="mt-1 w-full h-12 px-4 rounded-full bg-surface-container border-0"><option value="0">No folder</option>${folders.map(f=>`<option value="${f.id}">${esc(f.name)}</option>`).join('')}</select></label><details class="rounded-2xl bg-surface-container-low p-4"><summary class="cursor-pointer text-sm font-medium">Credentials</summary><p class="text-xs text-on-surface-variant mt-2">Credentials are encrypted with the operator keyring.</p><input id="sub-user" placeholder="Username" class="mt-3 w-full h-11 px-4 rounded-full bg-surface-container"><input id="sub-pass" type="password" placeholder="Password" class="mt-2 w-full h-11 px-4 rounded-full bg-surface-container"></details><label class="flex gap-3 text-sm"><input id="sub-auto" type="checkbox" checked> Auto-discover feed from website</label><div id="sub-error" class="hidden text-sm text-error"></div><div class="flex justify-end gap-2"><button type="button" onclick="closeModal()" class="h-10 px-5 rounded-full">Cancel</button><button id="sub-submit" class="h-10 px-5 rounded-full bg-primary text-on-primary">Subscribe</button></div></form>`);$('sub-url').focus()}
async function subscribe(e){e.preventDefault();const b=$('sub-submit');b.disabled=true;b.textContent='Subscribing…';try{await request(V13+'/feeds',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:$('sub-url').value,folderId:Number($('sub-folder').value),autoDiscover:$('sub-auto').checked,basicAuthUser:$('sub-user').value,basicAuthPassword:$('sub-pass').value})});closeModal();toast('Feed subscribed');reloadData()}catch(err){$('sub-error').textContent=err.message;$('sub-error').classList.remove('hidden');b.disabled=false;b.textContent='Subscribe'}}
function openFolder(){showModal(`<h2 class="text-xl font-semibold mb-5">New folder</h2><form onsubmit="createFolder(event)"><input id="folder-name" required maxlength="120" placeholder="Folder name" class="w-full h-12 px-4 rounded-full bg-surface-container"><div class="flex justify-end gap-2 mt-5"><button type="button" onclick="closeModal()" class="h-10 px-5 rounded-full">Cancel</button><button class="h-10 px-5 rounded-full bg-primary text-on-primary">Create</button></div></form>`);$('folder-name').focus()}
async function createFolder(e){e.preventDefault();try{await request(V13+'/folders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('folder-name').value})});closeModal();toast('Folder created');reloadData()}catch(err){toast(err.message,true)}}
function editFeed(id){const f=feeds.find(x=>x.id===id);showModal(`<h2 class="text-xl font-semibold mb-5">Feed options</h2><form onsubmit="saveFeed(event,${id})" class="space-y-4"><label class="block text-sm">Title<input id="edit-title" class="mt-1 w-full h-11 px-4 rounded-full bg-surface-container"></label><label class="block text-sm">Folder<select id="edit-folder" class="mt-1 w-full h-11 px-4 rounded-full bg-surface-container"><option value="0">No folder</option>${folders.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label><label class="flex justify-between text-sm">Pin to top<input id="edit-pinned" type="checkbox"></label><label class="flex justify-between text-sm">Enable updates<input id="edit-enabled" type="checkbox"></label><label class="flex justify-between text-sm">Retrieve full article text<input id="edit-full" type="checkbox"></label><label class="block text-sm">Ordering<select id="edit-order" class="mt-1 w-full h-11 px-4 rounded-full bg-surface-container"><option value="0">Default</option><option value="1">Oldest first</option><option value="2">Newest first</option></select></label><label class="block text-sm">Hide matching keywords<input id="edit-keywords" placeholder="politics, spoilers" class="mt-1 w-full h-11 px-4 rounded-full bg-surface-container"></label><div class="text-xs text-on-surface-variant">Last update: ${f.lastUpdateTime?new Date(f.lastUpdateTime*1000).toLocaleString():'Never'} · Errors: ${f.updateErrorCount||0}</div><div class="flex justify-between gap-2 pt-2"><button type="button" onclick="deleteFeed(${id})" class="h-10 px-5 rounded-full text-error hover:bg-error-container">Delete</button><div><button type="button" onclick="closeModal()" class="h-10 px-5 rounded-full">Cancel</button><button class="h-10 px-5 rounded-full bg-primary text-on-primary">Save</button></div></div></form>`);$('edit-title').value=f.title||'';$('edit-folder').value=String(f.folderId||0);$('edit-pinned').checked=!!f.pinned;$('edit-enabled').checked=!!f.updateEnabled;$('edit-full').checked=!!f.fullTextEnabled;$('edit-order').value=String(f.ordering||0);$('edit-keywords').value=f.keywordFilters||''}
async function saveFeed(e,id){e.preventDefault();await request(AUX+'/feed/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:$('edit-title').value,folderId:Number($('edit-folder').value),pinned:$('edit-pinned').checked,updateEnabled:$('edit-enabled').checked,fullTextEnabled:$('edit-full').checked,ordering:Number($('edit-order').value),keywordFilters:$('edit-keywords').value})});closeModal();toast('Feed updated');reloadData()}
async function deleteFeed(id){if(!await DarUI.confirmDialog({title:'Delete feed?',message:'All locally stored articles from this feed will be removed.',confirmLabel:'Delete',tone:'danger'}))return;await request(V13+'/feeds/'+id,{method:'DELETE'});closeModal();toast('Feed deleted');selectView('unread');reloadData()}
function openFeedSettings(){showModal(`<h2 class="text-xl font-semibold mb-4">Feed settings</h2><div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-left text-on-surface-variant"><th class="p-2">Title</th><th>Last update</th><th>Next update</th><th>APU</th><th>Errors</th></tr></thead><tbody>${feeds.map(f=>`<tr class="border-t border-outline-variant"><td class="p-2">${esc(f.title)}</td><td>${f.lastUpdateTime?new Date(f.lastUpdateTime*1000).toLocaleString():'—'}</td><td>${f.nextUpdateTime?new Date(f.nextUpdateTime*1000).toLocaleString():'—'}</td><td>${f.articlesPerUpdate||0}</td><td data-feed-settings-error="${f.id}">${f.updateErrorCount||0}</td></tr>`).join('')}</tbody></table></div><div class="flex justify-end mt-5"><button onclick="closeModal()" class="h-10 px-5 rounded-full bg-primary text-on-primary">Close</button></div>`);document.querySelectorAll('[data-feed-settings-error]').forEach(node=>{const feed=feeds.find(f=>f.id===Number(node.dataset.feedSettingsError));node.title=feed?.lastUpdateError||''})}
function settingSelect(id,label,value,values){return `<label class="block text-sm">${label}<select id="${id}" class="mt-1 w-full h-11 px-4 rounded-full bg-surface-container">${values.map(v=>`<option value="${v}" ${value===v?'selected':''}>${v[0].toUpperCase()+v.slice(1)}</option>`).join('')}</select></label>`}
function openSettings(){showModal(`<h2 class="text-xl font-semibold mb-5">News settings</h2><form onsubmit="saveSettings(event)" class="space-y-5"><section><h3 class="font-medium mb-3">General</h3><div class="space-y-3"><label class="flex justify-between text-sm">Disable mark read through scrolling<input id="p-scroll" type="checkbox" ${prefs.disableScrollRead?'checked':''}></label><label class="flex justify-between text-sm">Show all articles<input id="p-all" type="checkbox" ${prefs.showAll?'checked':''}></label><label class="flex justify-between text-sm">Reverse ordering<input id="p-oldest" type="checkbox" ${prefs.oldestFirst?'checked':''}></label><label class="flex justify-between text-sm">Disable automatic refresh<input id="p-auto" type="checkbox" ${prefs.disableAutoRefresh?'checked':''}></label></div></section><section class="grid grid-cols-2 gap-3"><h3 class="font-medium col-span-2">Media</h3>${settingSelect('p-thumbs','Embedded thumbnails',prefs.thumbnails,['always','ask','never'])}${settingSelect('p-enclosures','Enclosures',prefs.enclosures,['always','ask','never'])}${settingSelect('p-images','Article images',prefs.images,['always','ask','never'])}${settingSelect('p-iframes','Article iframes',prefs.iframes,['always','ask','never'])}</section><section class="grid grid-cols-2 gap-3"><h3 class="font-medium col-span-2">Appearance</h3>${settingSelect('p-display','Display mode',prefs.displayMode,['default','compact','screenreader'])}${settingSelect('p-split','Split mode',prefs.splitMode,['vertical','horizontal','off'])}</section><section><h3 class="font-medium mb-3">Import / Export</h3><div class="flex flex-wrap gap-2"><button type="button" onclick="chooseImport('opml')" class="h-10 px-4 rounded-full bg-surface-container-high">Import OPML</button><a href="${AUX}/opml" class="h-10 px-4 rounded-full bg-surface-container-high inline-flex items-center">Export OPML</a><button type="button" onclick="chooseImport('articles')" class="h-10 px-4 rounded-full bg-surface-container-high">Import articles</button><a href="${AUX}/articles" class="h-10 px-4 rounded-full bg-surface-container-high inline-flex items-center">Export articles</a></div></section><section><h3 class="font-medium">Keyboard shortcuts</h3><p class="text-sm text-on-surface-variant mt-2">J/N/→ next · K/P/← previous · S star · U unread · O open · R refresh · Escape close</p></section><div class="flex justify-end gap-2"><button type="button" onclick="closeModal()" class="h-10 px-5 rounded-full">Cancel</button><button class="h-10 px-5 rounded-full bg-primary text-on-primary">Save</button></div></form>`)}
async function saveSettings(e){e.preventDefault();prefs={disableScrollRead:$('p-scroll').checked,showAll:$('p-all').checked,oldestFirst:$('p-oldest').checked,disableAutoRefresh:$('p-auto').checked,thumbnails:$('p-thumbs').value,enclosures:$('p-enclosures').value,images:$('p-images').value,iframes:$('p-iframes').value,displayMode:$('p-display').value,splitMode:$('p-split').value};await request(AUX+'/preferences',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(prefs)});applyLayout();closeModal();toast('Settings saved');loadArticles()}
function chooseImport(kind){const input=$('import-file');input.accept=kind==='opml'?'.opml,.xml':'.json';input.onchange=async()=>{if(!input.files[0])return;const data=await input.files[0].text();try{const result=await request(AUX+'/'+kind,{method:'POST',headers:{'Content-Type':kind==='opml'?'text/xml':'application/json'},body:data});let message=`Imported ${result.created??result.imported??0} entries`;if(result.skipped)message+=` · ${result.skipped} skipped (matching subscriptions required)`;if(result.duplicates)message+=` · ${result.duplicates} already present`;toast(message);closeModal();reloadData()}catch(e){toast(e.message,true)}input.value=''};input.click()}
async function showExplore(){view='explore';$('view-title').textContent='Explore';const data=await request(AUX+'/explore');const list=Array.isArray(data.feeds)?data.feeds:[],root=$('article-list');root.replaceChildren();for(const f of list){const row=document.createElement('div');row.className='p-4 border-b border-outline-variant';const title=document.createElement('h2');title.className='font-medium';title.textContent=f.title||f.name||'';const description=document.createElement('p');description.className='text-sm text-on-surface-variant mt-1';description.textContent=f.description||'';const button=document.createElement('button');button.className='mt-3 h-9 px-4 rounded-full bg-primary text-on-primary text-sm';button.textContent='Subscribe';button.onclick=()=>subscribeExplore(encodeURIComponent(f.url||f.feed||''));row.append(title,description,button);root.appendChild(row)}showEmpty();closeMobileNav()}
function subscribeExplore(encoded){openSubscribe();$('sub-url').value=decodeURIComponent(encoded)}
function toggleMobileNav(){$('news-nav').classList.toggle('hidden');$('news-nav').classList.toggle('fixed');$('news-nav').classList.toggle('inset-y-14');$('news-nav').classList.toggle('left-0');$('news-nav').classList.toggle('z-30');$('news-nav').classList.toggle('w-72')}
function closeMobileNav(){const toggle=document.querySelector('[data-dar-sidebar-toggle]');if(DarUI.shell.isCompact()&&toggle?.getAttribute('aria-expanded')==='true')toggle.click()}
document.addEventListener('keydown',e=>{if($('modal-backdrop').classList.contains('flex')){if(e.key==='Escape')closeModal();return}const i=selected?articles.findIndex(x=>x.id===selected.id):-1;if(['j','n','ArrowRight'].includes(e.key)&&i<articles.length-1)openArticle(articles[i+1]?.id||articles[0]?.id);if(['k','p','ArrowLeft'].includes(e.key)&&i>0)openArticle(articles[i-1].id);if((e.key==='s'||e.key==='l')&&selected)toggleSelectedStar();if(e.key==='u'&&selected)request(V13+'/items/'+selected.id+'/unread',{method:'POST'}).then(loadArticles);if(e.key==='o'&&selected&&safeURL(selected.url))window.open(selected.url,'_blank','noopener');if(e.key==='r')refreshAll();if(e.key==='Escape')closeDetail()});
window.addEventListener('hashchange',async()=>{const targetID=targetArticleID();if(!targetID)return;view='all';viewID=0;activateNav();await loadArticles(targetID);await openArticle(targetID)});
window.addEventListener('popstate',()=>{if(DarUI.shell.isCompact()&&!history.state?.darDetail)closeDetail(true)});
init();
</script>
{{end}}
