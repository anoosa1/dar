[package]
name = "dar-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Rust port of Dar's runtime (next/runtime) for Files: sign-in, browser tokens, uploads, downloads, /dav and /oidc."

[dependencies]
axum = { workspace = true, features = ["ws"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "http1", "server-graceful"] }
tower = { version = "0.5", features = ["util"] }
tokio = { workspace = true, features = ["fs", "io-util", "signal", "process"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
base64.workspace = true
url.workspace = true
quick-xml = "0.42"
regex = "1"
httpdate = "1"
flate2 = "1"
hmac = "0.12"
subtle = "2"
getrandom = "0.4"
p256 = { version = "0.13", features = ["ecdsa"] }
aes-gcm = "0.10"
scrypt = { version = "0.11", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
rrule = "0.14"
dar-dav = { path = "../dav" }
dar-oidc = { path = "../oidc" }
