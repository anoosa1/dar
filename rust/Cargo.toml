[workspace]
resolver = "3"
members = ["oidc", "dav", "runtime"]
# The SpacetimeDB module and the browser client target wasm32 and keep their own lockfiles.
exclude = ["module", "client"]

[workspace.package]
edition = "2024"
license = "UNLICENSED"
publish = false
rust-version = "1.97"

[workspace.dependencies]
axum = "0.8.9"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
base64 = "0.22"
sha2 = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "cookies"] }

# Password hashing is memory-hard by design; unoptimised it takes many seconds per sign-in.
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
