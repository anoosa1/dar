[package]
name = "dar-module"
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false
description = "Port of Dar's SpacetimeDB module to Rust (in progress; not yet used by Dar)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pinned to the server Dar ships (nix/runtime.nix).
spacetimedb = { version = "=2.14.1", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
unicode-normalization = "0.1"

[dev-dependencies]
spacetimedb = { version = "=2.14.1", features = ["unstable", "test-utils"] }

# Field names without the raw-identifier prefix (see patch-macro.sh).
[patch.crates-io]
spacetimedb-bindings-macro = { path = "target/patches/spacetimedb-bindings-macro-2.14.1" }
