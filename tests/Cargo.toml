[package]
name = "dar-acceptance"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Dar's acceptance suite: the whole stack on throwaway roots, with a browser driver"

[[bin]]
name = "dar-acceptance"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true, features = ["fs", "io-util", "process"] }
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
url.workspace = true
base64.workspace = true
sha2.workspace = true
spacetimedb-sdk.workspace = true
dar-bindings.workspace = true
getrandom = "0.4"
futures-util = "0.3"
# Already in the workspace's lockfile (the runtime and the OpenID provider use them): regular
# expressions for assertions, dates, the credential formats Dar stores (scrypt, ES256, AES-GCM),
# archives, TLS for fake mail servers, and axum for fake HTTP and WebSocket services.
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
scrypt = { version = "0.11", default-features = false }
p256 = { version = "0.13", features = ["ecdsa"] }
aes-gcm = "0.10"
hmac = "0.12"
flate2 = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
axum = { workspace = true, features = ["ws", "query", "form"] }
jsonwebtoken = { version = "12", default-features = false, features = ["rust_crypto"] }
