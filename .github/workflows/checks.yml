name: Dar checks
on: [push, pull_request, workflow_dispatch]
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix develop --command npm ci --prefix next
      - run: nix develop --command npm --prefix next run verify
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix build .#dar .#checks.x86_64-linux.module-evaluation --no-link -L
      - run: nix develop --command npm ci --prefix next
      - run: |
          dar_package=$(nix build .#dar --no-link --print-out-paths)
          nix develop --command node next/scripts/verify-package.mjs "$dar_package/bin/dar"
